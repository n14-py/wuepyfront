<!DOCTYPE html>
<html lang="es" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuepy | Panel de Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Ocultar scrollbars en listas horizontales pero mantener funcionalidad */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        // Lógica Cliente para reemplazar EJS y conectar con api.js
        document.addEventListener('alpine:init', () => {
            Alpine.data('headerAuth', () => ({
                user: null,
                init() {
                    // Leemos los datos del usuario que guardamos en localStorage al hacer login
                    const userData = localStorage.getItem('wuepy_user');
                    if (userData) {
                        this.user = JSON.parse(userData);
                    }
                },
                logout(e) {
                    e.preventDefault();
                    if(typeof WuepyAPI !== 'undefined') {
                        WuepyAPI.logoutLocal();
                    } else {
                        localStorage.removeItem('wuepy_user');
                        window.location.href = '/auth/login.html';
                    }
                }
            }));
        });
    </script>
</head>
<body class="text-slate-800 antialiased" x-data="headerAuth()">

    <template x-if="user">
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    
                    <div class="flex items-center gap-8">
                        <a href="/dashboard" class="flex items-center gap-2 group">
                            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-lg shadow-md group-hover:bg-blue-700 transition">W</div>
                            <span class="text-xl font-extrabold text-slate-900 tracking-tight">Wuepy</span>
                        </a>
                        
                        <div class="hidden md:flex space-x-2">
                            <a href="/dashboard" class="text-slate-600 hover:text-blue-600 hover:bg-blue-50 px-3 py-2 rounded-lg text-sm font-bold transition">Mis Tiendas</a>
                            
                            <template x-if="user.type !== 'employee'">
                                <a href="/dashboard/create-site" class="text-slate-600 hover:text-blue-600 hover:bg-blue-50 px-3 py-2 rounded-lg text-sm font-bold transition">Nueva Tienda</a>
                            </template>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="hidden sm:block text-sm text-slate-500 text-right">
                            <div class="font-medium">
                                Hola, <span class="font-bold text-slate-900" x-text="user.name"></span>
                            </div>
                            
                            <template x-if="user.type === 'employee'">
                                <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Empleado (<span x-text="user.siteName"></span>)</span>
                            </template>
                            
                            <template x-if="user.type !== 'employee'">
                                <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Administrador</span>
                            </template>
                        </div>
                        
                        <div class="h-8 w-px bg-slate-200 mx-2 hidden sm:block"></div>
                        
                        <a href="#" @click="logout" class="text-slate-400 hover:text-red-500 p-2 transition flex items-center gap-2" title="Cerrar Sesión">
                            <i class="fas fa-sign-out-alt text-lg"></i>
                            <span class="text-sm font-bold hidden md:inline">Salir</span>
                        </a>
                    </div>
                    
                </div>
            </div>
            
            <div class="md:hidden border-t border-slate-100 bg-slate-50 overflow-x-auto scrollbar-hide">
                <div class="flex px-4 py-2 gap-2">
                    <a href="/dashboard" class="whitespace-nowrap text-slate-600 hover:text-blue-600 bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-bold transition">Mis Tiendas</a>
                    <template x-if="user.type !== 'employee'">
                        <a href="/dashboard/create-site" class="whitespace-nowrap text-slate-600 hover:text-blue-600 bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-bold transition">Nueva Tienda</a>
                    </template>
                </div>
            </div>
        </nav>
    </template>

    <main class="flex-1">
