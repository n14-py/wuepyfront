<!DOCTYPE html>
<html lang="es" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel General - Wuepy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        .hover-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="text-slate-800" x-data="siteOverview()">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm" x-show="user" x-cloak>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/dashboard/index.html" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-lg shadow-md group-hover:bg-blue-700 transition">W</div>
                    <span class="text-xl font-extrabold text-slate-900 tracking-tight">Wuepy</span>
                </a>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-sm text-slate-500 text-right font-medium">Hola, <span class="font-bold text-slate-900" x-text="user?.name"></span></div>
                    <div class="h-8 w-px bg-slate-200 mx-2 hidden sm:block"></div>
                    <a href="#" @click.prevent="WuepyAPI.logoutLocal()" class="text-slate-400 hover:text-red-500 p-2 transition flex items-center gap-2"><i class="fas fa-sign-out-alt text-lg"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-4">
            <a href="/dashboard/index.html" class="inline-flex items-center text-sm font-bold text-slate-400 hover:text-indigo-600 transition">
                <i class="fas fa-arrow-left mr-2"></i> Volver a Mis Tiendas
            </a>
        </div>

        <template x-if="isLoading">
            <div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i></div>
        </template>

        <template x-if="!isLoading && site">
            <div>
                <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-sm border border-slate-200 mb-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-50 rounded-full blur-[80px] -z-10 translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 relative z-10">
                        <div class="flex items-center gap-6">
                            <div class="w-20 h-20 md:w-24 md:h-24 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center overflow-hidden shrink-0">
                                <template x-if="site.logoUrl && !site.logoUrl.includes('placehold')">
                                    <img :src="site.logoUrl" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!site.logoUrl || site.logoUrl.includes('placehold')">
                                    <div class="w-full h-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-black text-3xl" x-text="site.name.charAt(0).toUpperCase()"></div>
                                </template>
                            </div>
                            
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <template x-if="site.subscriptionStatus === 'active' || site.subscriptionStatus === 'trial'">
                                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-emerald-100 text-emerald-700 border border-emerald-200">
                                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Tienda En Línea
                                        </span>
                                    </template>
                                    <template x-if="!(site.subscriptionStatus === 'active' || site.subscriptionStatus === 'trial')">
                                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-red-100 text-red-700 border border-red-200">
                                            <span class="w-2 h-2 rounded-full bg-red-500"></span> Pago Pendiente
                                        </span>
                                    </template>
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-600 border border-slate-200" x-text="'Plan ' + site.plan"></span>
                                </div>

                                <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight leading-none mb-2" x-text="site.name"></h1>
                                
                                <a :href="'https://' + site.subdomain + '.wuepy.com'" target="_blank" class="inline-flex items-center gap-2 text-sm font-bold text-indigo-600 hover:text-indigo-800 transition bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-100">
                                    <span x-text="site.subdomain + '.wuepy.com'"></span> <i class="fas fa-external-link-alt text-xs"></i>
                                </a>
                            </div>
                        </div>

                        <a :href="'/dashboard/pos.html?id=' + site._id" class="w-full md:w-auto bg-slate-900 hover:bg-black text-white px-8 py-4 rounded-xl font-black shadow-xl shadow-slate-900/20 transition transform hover:-translate-y-1 flex items-center justify-center gap-3 text-lg">
                            <i class="fas fa-cash-register text-emerald-400"></i> Abrir Caja POS
                        </a>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
                        <div class="w-14 h-14 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-2xl shrink-0"><i class="fas fa-eye"></i></div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Visitas Web</p>
                            <h3 class="text-2xl font-black text-slate-900" x-text="stats?.views || site.views || 0"></h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
                        <div class="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl shrink-0"><i class="fas fa-boxes"></i></div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Productos</p>
                            <h3 class="text-2xl font-black text-slate-900" x-text="stats?.products || 0"></h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
                        <div class="w-14 h-14 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center text-2xl shrink-0"><i class="fas fa-users"></i></div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Equipo</p>
                            <h3 class="text-2xl font-black text-slate-900"><span x-text="site.employees?.length || 0"></span> <span class="text-sm text-slate-400 font-medium">miembros</span></h3>
                        </div>
                    </div>
                </div>

                <h2 class="text-xl font-black text-slate-900 mb-6 flex items-center gap-2"><i class="fas fa-th-large text-slate-400"></i> Módulos de Gestión</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <a :href="'/dashboard/pos.html?id=' + site._id" class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm hover-card flex flex-col h-full relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-50 rounded-full z-0 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="relative z-10 flex-1">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl mb-4 shadow-sm"><i class="fas fa-desktop"></i></div>
                            <h3 class="text-lg font-black text-slate-900 mb-2">Punto de Venta</h3>
                            <p class="text-sm text-slate-500 font-medium">Cobra en mostrador, asigna deliveries y calcula vueltos.</p>
                        </div>
                    </a>

                    <a :href="'/dashboard/inventory.html?id=' + site._id" class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm hover-card flex flex-col h-full relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full z-0 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="relative z-10 flex-1">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl mb-4 shadow-sm"><i class="fas fa-box-open"></i></div>
                            <h3 class="text-lg font-black text-slate-900 mb-2">Catálogo Web</h3>
                            <p class="text-sm text-slate-500 font-medium">Agrega productos, fotos, precios y controla el stock.</p>
                        </div>
                    </a>

                    <template x-if="user?.type !== 'employee'">
                        <a :href="'/dashboard/finances.html?id=' + site._id" class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm hover-card flex flex-col h-full relative overflow-hidden group">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-purple-50 rounded-full z-0 group-hover:scale-150 transition-transform duration-500"></div>
                            <div class="relative z-10 flex-1">
                                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-2xl mb-4 shadow-sm"><i class="fas fa-chart-pie"></i></div>
                                <h3 class="text-lg font-black text-slate-900 mb-2">Finanzas</h3>
                                <p class="text-sm text-slate-500 font-medium">Monitorea ingresos, carga gastos y exporta reportes.</p>
                            </div>
                        </a>
                    </template>

                    <template x-if="user?.type !== 'employee'">
                        <a :href="'/dashboard/site-settings.html?id=' + site._id" class="bg-slate-900 rounded-[2rem] p-6 border border-slate-800 shadow-sm hover-card flex flex-col h-full relative overflow-hidden group">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-slate-800 rounded-full z-0 group-hover:scale-150 transition-transform duration-500"></div>
                            <div class="relative z-10 flex-1">
                                <div class="w-12 h-12 bg-slate-800 text-white rounded-xl flex items-center justify-center text-2xl mb-4 shadow-sm border border-slate-700"><i class="fas fa-cog"></i></div>
                                <h3 class="text-lg font-black text-white mb-2">Ajustes Generales</h3>
                                <p class="text-sm text-slate-400 font-medium">Edita la apariencia, agrega empleados o modifica tu plan.</p>
                            </div>
                        </a>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('siteOverview', () => ({
                user: null, site: null, stats: null, isLoading: true,
                
                async init() {
                    this.user = WuepyAPI.getUser();
                    if(!this.user) { window.location.href = '/auth/login.html'; return; }
                    
                    const pathSegments = window.location.pathname.split('/');
                    const siteIdx = pathSegments.indexOf('site');
                    this.siteId = siteIdx !== -1 ? pathSegments[siteIdx + 1] : null;

                    if(!this.siteId) { window.location.href = '/dashboard/index.html'; return; }

                    await this.loadData();
                },
            }));
        });
    </script>
</body>
</html>
