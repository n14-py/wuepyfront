<!DOCTYPE html>
<html lang="es" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Tienda - Wuepy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        [x-cloak] { display: none !important; }
        .setting-section { transition: all 0.3s ease; }
        .setting-section:focus-within { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); border-color: #cbd5e1; }
    </style>
</head>
<body class="text-slate-800" x-data="siteSettings()">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm" x-show="user" x-cloak>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/dashboard/index.html" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-lg shadow-md group-hover:bg-blue-700 transition">W</div>
                    <span class="text-xl font-extrabold text-slate-900 tracking-tight">Wuepy</span>
                </a>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-sm text-slate-500 text-right font-medium">Hola, <span class="font-bold text-slate-900" x-text="user?.name"></span></div>
                    <div class="h-8 w-px bg-slate-200 mx-2 hidden sm:block"></div>
                    <a href="#" @click.prevent="WuepyAPI.logoutLocal()" class="text-slate-400 hover:text-red-500 p-2 transition flex items-center gap-2"><i class="fas fa-sign-out-alt text-lg"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <template x-if="isLoading">
        <div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i></div>
    </template>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-show="!isLoading" x-cloak>
        
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <a :href="'/dashboard/site-overview.html?id=' + siteId" class="inline-flex items-center text-sm font-bold text-slate-400 hover:text-indigo-600 transition mb-2">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al Panel
                </a>
                <h1 class="text-3xl font-black text-slate-900 flex items-center gap-3">
                    <i class="fas fa-cog text-slate-400"></i> Ajustes de Tienda
                </h1>
            </div>
            <a :href="'https://' + site?.subdomain + '.wuepy.com'" target="_blank" class="inline-flex items-center justify-center gap-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-5 py-2.5 rounded-xl font-bold transition border border-indigo-200">
                Ver Tienda <i class="fas fa-external-link-alt text-xs"></i>
            </a>
        </div>

        <template x-if="site && ['pending_payment', 'expired', 'suspended'].includes(site.subscriptionStatus)">
            <div class="bg-red-50 border border-red-200 rounded-2xl p-5 mb-8 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm relative overflow-hidden">
                <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjM5LDY4LDY4LDAuMSkiLz48L3N2Zz4=')] opacity-50"></div>
                <div class="flex items-center gap-4 text-red-700 relative z-10">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm shrink-0">
                        <i class="fas fa-lock text-2xl text-red-500"></i>
                    </div>
                    <div>
                        <p class="font-black text-sm uppercase tracking-widest">Tienda Suspendida / Pago Pendiente</p>
                        <p class="text-sm font-medium mt-0.5">Tus clientes están viendo la pantalla de bloqueo. Paga tu suscripción para reactivarla.</p>
                    </div>
                </div>
                <a :href="'/dashboard/billing.html?id=' + siteId" class="shrink-0 relative z-10 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl text-sm font-black uppercase tracking-widest shadow-lg shadow-red-600/30 transition transform hover:-translate-y-0.5">
                    Pagar Ahora
                </a>
            </div>
        </template>

        <div class="flex flex-col md:flex-row gap-8">
            
            <div class="w-full md:w-64 shrink-0">
                <div class="bg-white rounded-2xl border border-slate-200 p-2 shadow-sm sticky top-24">
                    <button @click="activeTab = 'general'" :class="activeTab === 'general' ? 'bg-indigo-50 text-indigo-700 font-black' : 'text-slate-600 hover:bg-slate-50 font-medium'" class="w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 mb-1">
                        <i class="fas fa-store w-5 text-center" :class="activeTab === 'general' ? 'text-indigo-500' : 'text-slate-400'"></i> General
                    </button>
                    <button @click="activeTab = 'design'" :class="activeTab === 'design' ? 'bg-blue-50 text-blue-700 font-black' : 'text-slate-600 hover:bg-slate-50 font-medium'" class="w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 mb-1">
                        <i class="fas fa-paint-brush w-5 text-center" :class="activeTab === 'design' ? 'text-blue-500' : 'text-slate-400'"></i> Diseño <template x-if="site?.designMode === 'ai_generated'"><span class="ml-auto w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span></template>
                    </button>
                    <button @click="activeTab = 'team'" :class="activeTab === 'team' ? 'bg-purple-50 text-purple-700 font-black' : 'text-slate-600 hover:bg-slate-50 font-medium'" class="w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3">
                        <i class="fas fa-users w-5 text-center" :class="activeTab === 'team' ? 'text-purple-500' : 'text-slate-400'"></i> Equipo
                    </button>
                </div>
            </div>

            <div class="flex-1 space-y-6">

                <div x-show="activeTab === 'general'" x-transition.opacity.duration.300ms>
                    <form @submit.prevent="updateGeneralSettings" class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden setting-section">
                        <div class="p-6 md:p-8 border-b border-slate-100">
                            <h2 class="text-xl font-black text-slate-900 mb-6">Información Básica y Contacto</h2>
                            
                            <div class="space-y-5">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Nombre Comercial</label>
                                        <input type="text" x-model="formData.name" required class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 font-bold text-slate-800 transition outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-1">
                                            <i class="fas fa-lock text-slate-400"></i> Enlace Web (Subdominio)
                                        </label>
                                        <div class="flex items-center opacity-70">
                                            <input type="text" :value="formData.subdomain" disabled class="w-full px-4 py-3 bg-slate-100 border-2 border-slate-200 rounded-l-xl font-black text-slate-500 cursor-not-allowed">
                                            <span class="bg-slate-200 px-4 py-3 border-y-2 border-r-2 border-slate-200 rounded-r-xl font-bold text-slate-500">.wuepy.com</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">WhatsApp de Ventas</label>
                                        <div class="relative">
                                            <i class="fab fa-whatsapp absolute left-4 top-3.5 text-emerald-500 text-lg"></i>
                                            <input type="text" x-model="formData.whatsapp" placeholder="Ej: 0981123456" class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-emerald-500 font-bold text-slate-800 transition outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Dirección Física</label>
                                        <div class="relative">
                                            <i class="fas fa-map-marker-alt absolute left-4 top-4 text-slate-400"></i>
                                            <input type="text" x-model="formData.address" placeholder="Ej: Av. Central 123" class="w-full pl-10 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 font-bold text-slate-800 transition outline-none">
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-4 border-t border-slate-100">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Redes Sociales</label>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Instagram (Link)</label>
                                            <input type="text" x-model="formData.instagram" placeholder="https://instagram.com/..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-pink-500">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Facebook (Link)</label>
                                            <input type="text" x-model="formData.facebook" placeholder="https://facebook.com/..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 mb-1">TikTok (Link)</label>
                                            <input type="text" x-model="formData.tiktok" placeholder="https://tiktok.com/@..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-slate-500">
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-4 border-t border-slate-100">
                                    <label class="flex items-center gap-3 cursor-pointer p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 transition">
                                        <input type="checkbox" x-model="formData.showInMarketplace" class="w-5 h-5 text-indigo-600 rounded border-slate-300">
                                        <div>
                                            <span class="block text-sm font-black text-slate-900">Listar en el Marketplace Global</span>
                                            <span class="block text-xs text-slate-500 font-medium">Tus productos aparecerán en wuepy.com para ganar visibilidad.</span>
                                        </div>
                                    </label>
                                </div>

                                <div class="mt-6 pt-6 border-t border-slate-100">
                                    <div class="flex items-center gap-2 mb-4">
                                        <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest">Textos de la Web</h3>
                                        <template x-if="site?.designMode === 'ai_generated'">
                                            <span class="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-[9px] font-black uppercase rounded-md">Definido por IA</span>
                                        </template>
                                    </div>
                                    <div class="space-y-5">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Título Principal (Hero)</label>
                                            <input type="text" x-model="formData.heroTitle" placeholder="Ej: La mejor ropa de Paraguay" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 font-bold text-slate-800 transition outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Historia / Quiénes Somos</label>
                                            <textarea x-model="formData.aboutText" rows="4" placeholder="Escribe la misión o historia de tu empresa..." class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-indigo-500 font-medium text-slate-800 transition outline-none resize-none"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-6 flex justify-end">
                            <button type="submit" :disabled="isSaving" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-black shadow-lg shadow-indigo-600/30 transition transform active:scale-95 disabled:opacity-70 flex items-center gap-2 uppercase tracking-widest text-sm">
                                <i class="fas" :class="isSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

                <div x-show="activeTab === 'design'" x-transition.opacity.duration.300ms style="display: none;">
                    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden setting-section">
                        <div class="p-6 md:p-8 border-b border-slate-100">
                            <h2 class="text-xl font-black text-slate-900 mb-6 flex items-center gap-2"><i class="fas fa-paint-brush text-blue-500"></i> Apariencia y Moneda</h2>
                            
                            <form @submit.prevent="updateDesignSettings" class="space-y-8">
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Logo de la Tienda</label>
                                        <div class="flex items-center gap-6">
                                            <div class="w-24 h-24 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 flex items-center justify-center overflow-hidden relative group shrink-0">
                                                <template x-if="logoPreview">
                                                    <img :src="logoPreview" class="w-full h-full object-cover">
                                                </template>
                                                <template x-if="!logoPreview">
                                                    <i class="fas fa-image text-3xl text-slate-300"></i>
                                                </template>
                                                <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center transition cursor-pointer">
                                                    <i class="fas fa-upload text-white text-xl"></i>
                                                </div>
                                                <input type="file" @change="handleLogoChange" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10 w-full h-full">
                                            </div>
                                            <div>
                                                <p class="text-xs text-slate-500 font-medium mb-3">Recomendado: 500x500px, PNG (Max 2MB).</p>
                                                <button type="button" @click="$el.previousElementSibling.previousElementSibling.querySelector('input').click()" class="text-xs font-black text-blue-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg transition uppercase tracking-wider">
                                                    Cambiar Logo
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Moneda de la Tienda</label>
                                        <select x-model="formData.currency" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:bg-white focus:border-blue-500 font-bold text-slate-800 transition outline-none">
                                            <option value="PYG">Guaraní Paraguayo (PYG - Gs.)</option>
                                            <option value="USD">Dólar Estadounidense (USD - $)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-6 pt-4 border-t border-slate-100">
                                    <div>
                                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Color Principal</label>
                                        <div class="flex items-center gap-3 bg-white border-2 border-slate-100 rounded-xl px-4 py-2">
                                            <input type="color" x-model="formData.primaryColor" class="w-8 h-8 rounded cursor-pointer border-none p-0 bg-transparent">
                                            <span class="text-xs font-bold text-slate-600 uppercase" x-text="formData.primaryColor"></span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Color Secundario</label>
                                        <div class="flex items-center gap-3 bg-white border-2 border-slate-100 rounded-xl px-4 py-2">
                                            <input type="color" x-model="formData.secondaryColor" class="w-8 h-8 rounded cursor-pointer border-none p-0 bg-transparent">
                                            <span class="text-xs font-bold text-slate-600 uppercase" x-text="formData.secondaryColor"></span>
                                        </div>
                                    </div>
                                </div>

                                <template x-if="site?.designMode !== 'ai_generated'">
                                    <div class="pt-4 border-t border-slate-100">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Plantilla Activa</label>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <label class="relative cursor-pointer group">
                                                <input type="radio" x-model="formData.template" value="template1" class="peer sr-only">
                                                <div class="border-2 border-slate-200 rounded-xl p-4 bg-white hover:bg-slate-50 transition peer-checked:border-blue-500 peer-checked:bg-blue-50">
                                                    <div class="w-full h-24 bg-slate-200 rounded-lg mb-3 bg-cover bg-center" style="background-image: url('https://placehold.co/400x200?text=E-Commerce+Moderno');"></div>
                                                    <h4 class="font-black text-slate-800 text-sm">Plantilla 1: Moderna</h4>
                                                    <p class="text-[10px] text-slate-500 mt-1">E-Commerce completo, diseño claro y minimalista.</p>
                                                </div>
                                                <div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-slate-300 peer-checked:border-blue-500 peer-checked:bg-blue-500 flex items-center justify-center transition">
                                                    <i class="fas fa-check text-white text-[10px] opacity-0 peer-checked:opacity-100"></i>
                                                </div>
                                            </label>
                                            <label class="relative cursor-pointer group">
                                                <input type="radio" x-model="formData.template" value="template2" class="peer sr-only">
                                                <div class="border-2 border-slate-200 rounded-xl p-4 bg-white hover:bg-slate-50 transition peer-checked:border-blue-500 peer-checked:bg-blue-50">
                                                    <div class="w-full h-24 bg-slate-800 rounded-lg mb-3 bg-cover bg-center" style="background-image: url('https://placehold.co/400x200/1e293b/ffffff?text=Diseño+Oscuro');"></div>
                                                    <h4 class="font-black text-slate-800 text-sm">Plantilla 2: Oscura</h4>
                                                    <p class="text-[10px] text-slate-500 mt-1">Diseño agresivo, ideal para electrónica o motor.</p>
                                                </div>
                                                <div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-slate-300 peer-checked:border-blue-500 peer-checked:bg-blue-500 flex items-center justify-center transition">
                                                    <i class="fas fa-check text-white text-[10px] opacity-0 peer-checked:opacity-100"></i>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="site?.designMode === 'ai_generated'">
                                    <div class="mt-8 p-6 md:p-8 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-2xl border border-indigo-500/30 shadow-2xl relative overflow-hidden">
                                        <div class="relative z-10">
                                            <h3 class="text-xl font-black text-white mb-2 flex items-center gap-3">
                                                <i class="fas fa-magic text-emerald-400 animate-pulse"></i> Orquestador IA (Re-Construcción)
                                            </h3>
                                            <p class="text-indigo-200 text-sm font-medium mb-5">Si necesitas un cambio radical de diseño, describe una nueva idea y la IA destruirá la arquitectura visual antigua para programar una nueva desde cero.</p>
                                            
                                            <textarea x-model="aiPromptInput" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-indigo-300/50 focus:bg-white/10 focus:border-emerald-400 outline-none mb-5 font-medium text-sm transition" placeholder="Ej: Hazlo más oscuro, tipo cyberpunk, o cambia a un estilo súper minimalista y elegante..."></textarea>
                                            
                                            <button type="button" @click="regenerateAi" :disabled="isRegenerating" class="w-full sm:w-auto bg-red-600 hover:bg-red-500 text-white px-6 py-3.5 rounded-xl font-black shadow-[0_0_20px_rgba(220,38,38,0.4)] transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                                                <i class="fas" :class="isRegenerating ? 'fa-spinner fa-spin' : 'fa-radiation'"></i> 
                                                <span x-text="isRegenerating ? 'Construyendo Nueva Web...' : 'Destruir y Regenerar con IA'"></span>
                                            </button>
                                            <p class="text-[10px] text-slate-400 mt-4 font-medium"><i class="fas fa-shield-alt text-emerald-500 mr-1"></i> Tus productos, ventas e inventario están protegidos y NO se borrarán.</p>
                                        </div>
                                        <i class="fas fa-brain absolute -bottom-10 -right-10 text-9xl text-white opacity-5 transform -rotate-12"></i>
                                    </div>
                                </template>

                                <div class="flex justify-end pt-4 border-t border-slate-100">
                                    <button type="submit" :disabled="isSaving" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-black shadow-lg shadow-blue-600/30 transition transform active:scale-95 disabled:opacity-70 flex items-center gap-2 uppercase tracking-widest text-sm">
                                        <i class="fas" :class="isSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i> Guardar Diseño Base
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div x-show="activeTab === 'team'" x-transition.opacity.duration.300ms style="display: none;">
                    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden setting-section mb-6">
                        <div class="p-6 md:p-8 border-b border-slate-100 flex justify-between items-center bg-slate-900 text-white">
                            <div>
                                <h2 class="text-xl font-black mb-1 flex items-center gap-2"><i class="fas fa-users text-purple-400"></i> Miembros del Equipo</h2>
                                <p class="text-xs text-slate-400 font-medium">Asigna cajeros o administradores a tu tienda.</p>
                            </div>
                            <button @click="showAddEmployeeModal = true" class="bg-purple-500 hover:bg-purple-400 text-white px-5 py-2.5 rounded-xl font-black shadow-lg shadow-purple-500/30 transition transform active:scale-95 flex items-center gap-2 text-sm uppercase tracking-wider">
                                <i class="fas fa-plus"></i> Invitar
                            </button>
                        </div>
                        
                        <div class="p-0">
                            <template x-if="!employees || employees.length === 0">
                                <div class="text-center py-12 px-4">
                                    <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200"><i class="fas fa-user-times text-2xl text-slate-300"></i></div>
                                    <p class="text-slate-500 font-bold">Aún no hay empleados registrados en esta tienda.</p>
                                </div>
                            </template>

                            <template x-if="employees && employees.length > 0">
                                <ul class="divide-y divide-slate-100">
                                    <template x-for="emp in employees" :key="emp._id">
                                        <li class="p-4 sm:p-6 hover:bg-slate-50 transition flex items-center justify-between gap-4">
                                            <div class="flex items-center gap-4">
                                                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-black shrink-0" x-text="emp.name ? emp.name.charAt(0).toUpperCase() : 'E'"></div>
                                                <div>
                                                    <h4 class="font-black text-slate-900 text-sm" x-text="emp.name"></h4>
                                                    <p class="text-[11px] text-slate-500 font-medium" x-text="emp.email"></p>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-4">
                                                <span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md text-[10px] font-black uppercase tracking-widest" x-text="emp.role || 'Cajero'"></span>
                                                <button @click="removeEmployee(emp._id)" class="text-slate-300 hover:text-red-500 transition p-2" title="Eliminar Empleado">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div x-show="showAddEmployeeModal" x-cloak class="fixed z-[100] inset-0 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
            <div x-show="showAddEmployeeModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm transition-opacity" @click="showAddEmployeeModal = false"></div>
            
            <div x-show="showAddEmployeeModal" 
                 x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                 class="inline-block bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md w-full border border-slate-200 relative z-[101]">
                
                <form @submit.prevent="addEmployee">
                    <div class="bg-white px-6 pt-6 pb-6 border-b border-slate-100">
                        <div class="flex items-center justify-center h-14 w-14 rounded-full bg-purple-100 border border-purple-200 mx-auto mb-4">
                            <i class="fas fa-user-plus text-2xl text-purple-600"></i>
                        </div>
                        <h3 class="text-xl leading-6 font-black text-slate-900 text-center uppercase tracking-tight mb-6">Nuevo Empleado</h3>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 uppercase tracking-wider">Nombre</label>
                                <input type="text" x-model="newEmployee.name" required class="w-full px-4 py-3 border-2 border-slate-100 bg-slate-50 rounded-xl focus:ring-0 focus:bg-white focus:border-purple-500 font-bold text-slate-800 transition outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 uppercase tracking-wider">Correo Electrónico</label>
                                <input type="email" x-model="newEmployee.email" required class="w-full px-4 py-3 border-2 border-slate-100 bg-slate-50 rounded-xl focus:ring-0 focus:bg-white focus:border-purple-500 font-bold text-slate-800 transition outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 uppercase tracking-wider">Contraseña Temporal</label>
                                <input type="password" x-model="newEmployee.password" required class="w-full px-4 py-3 border-2 border-slate-100 bg-slate-50 rounded-xl focus:ring-0 focus:bg-white focus:border-purple-500 font-bold text-slate-800 transition outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 uppercase tracking-wider">Rol</label>
                                <select x-model="newEmployee.role" class="w-full px-4 py-3 border-2 border-slate-100 bg-slate-50 rounded-xl focus:ring-0 focus:bg-white focus:border-purple-500 font-bold text-slate-800 transition outline-none">
                                    <option value="cajero">Cajero (Solo POS)</option>
                                    <option value="admin">Administrador (Catálogo y POS)</option>
                                    <option value="delivery">Delivery (Repartidor)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-6 py-4 flex flex-row-reverse gap-3">
                        <button type="submit" :disabled="isSaving" class="flex-1 rounded-xl shadow-lg shadow-purple-500/30 px-4 py-3 bg-purple-600 text-sm font-black text-white hover:bg-purple-700 uppercase tracking-widest transition transform active:scale-95">
                            <i class="fas" :class="isSaving ? 'fa-spinner fa-spin' : 'fa-check'"></i> Crear
                        </button>
                        <button type="button" @click="showAddEmployeeModal = false" class="flex-1 rounded-xl border-2 border-slate-200 px-4 py-3 bg-white text-sm font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('siteSettings', () => ({
                user: null, siteId: null, site: null, isLoading: true, isSaving: false, isRegenerating: false,
                activeTab: 'general',
                formData: { 
                    name: '', subdomain: '', currency: 'PYG', whatsapp: '', 
                    address: '', facebook: '', instagram: '', tiktok: '', showInMarketplace: false,
                    template: 'template1', heroTitle: '', aboutText: '',
                    primaryColor: '#3b82f6', secondaryColor: '#1e293b'
                },
                logoFile: null, logoPreview: null,
                aiPromptInput: '',
                employees: [],
                showAddEmployeeModal: false,
                newEmployee: { name: '', email: '', password: '', role: 'cajero' },

                async init() {
                    this.user = WuepyAPI.getUser();
                    if(!this.user) { window.location.href = '/auth/login.html'; return; }
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    let urlSiteId = urlParams.get('id') || urlParams.get('siteId');

                    if (!urlSiteId) {
                        const pathSegments = window.location.pathname.split('/');
                        const siteIdx = pathSegments.indexOf('site');
                        urlSiteId = siteIdx !== -1 ? pathSegments[siteIdx + 1] : null;
                    }

                    this.siteId = urlSiteId;

                    if(!this.siteId) { 
                        window.location.href = '/dashboard/index.html'; 
                        return; 
                    }

                    await this.loadSiteData();
                },

                async loadSiteData() {
                    this.isLoading = true;
                    try {
                        const res = await WuepyAPI.fetch(`/dashboard/site/${this.siteId}/settings`); 
                        if(res.status === 200) {
                            this.site = res.data.site;
                            this.employees = res.data.site.employees || [];
                            
                            this.formData = {
                                name: this.site.name || '',
                                subdomain: this.site.subdomain || '',
                                currency: this.site.currency || 'PYG',
                                whatsapp: this.site.contact?.whatsapp || '',
                                address: this.site.contact?.address || '',
                                facebook: this.site.social?.facebook || '',
                                instagram: this.site.social?.instagram || '',
                                tiktok: this.site.social?.tiktok || '',
                                showInMarketplace: this.site.showInMarketplace || false,
                                template: this.site.template || 'template1',
                                heroTitle: this.site.content?.heroTitle || '',
                                aboutText: this.site.content?.aboutText || '',
                                primaryColor: this.site.primaryColor || '#3b82f6',
                                secondaryColor: this.site.secondaryColor || '#1e293b'
                            };

                            this.aiPromptInput = this.site.aiPrompt || '';
                            
                            if (this.site.logoUrl && !this.site.logoUrl.includes('placehold')) {
                                this.logoPreview = this.site.logoUrl;
                            }
                        } else {
                            alert('No se pudo cargar la configuración.');
                            window.location.href = '/dashboard/index.html';
                        }
                    } catch(e) {
                        console.error(e);
                        alert('Error de conexión.');
                    } finally {
                        this.isLoading = false;
                    }
                },

                handleLogoChange(event) {
                    const file = event.target.files[0];
                    if (file) {
                        if (file.size > 2 * 1024 * 1024) return alert('El logo no debe superar los 2MB.');
                        this.logoFile = file;
                        this.logoPreview = URL.createObjectURL(file);
                    }
                },

                async updateGeneralSettings() {
                    this.isSaving = true;
                    try {
                        const payload = {
                            name: this.formData.name,
                            whatsapp: this.formData.whatsapp,
                            address: this.formData.address,
                            facebook: this.formData.facebook,
                            instagram: this.formData.instagram,
                            tiktok: this.formData.tiktok,
                            showInMarketplace: this.formData.showInMarketplace,
                            heroTitle: this.formData.heroTitle,
                            aboutText: this.formData.aboutText,
                            designMode: this.site.designMode // <-- INYECCIÓN DE PROTECCIÓN IA
                        };
                        
                        const res = await WuepyAPI.fetch(`/dashboard/site/${this.siteId}/update-general`, {
                            method: 'POST', body: JSON.stringify(payload)
                        });

                        if(res.status === 200) {
                            Swal.fire({ icon: 'success', title: '¡Guardado!', text: 'Información general actualizada.', timer: 2000, showConfirmButton: false });
                            await this.loadSiteData(); 
                        } else {
                            alert(res.data?.message || 'Error al guardar.');
                        }
                    } catch (error) { alert('Error de conexión.'); }
                    this.isSaving = false;
                },

                async updateDesignSettings() {
                    this.isSaving = true;
                    try {
                        const form = new FormData();
                        form.append('currency', this.formData.currency);
                        form.append('template', this.formData.template);
                        form.append('primaryColor', this.formData.primaryColor);
                        form.append('secondaryColor', this.formData.secondaryColor);
                        form.append('designMode', this.site.designMode); // <-- INYECCIÓN DE PROTECCIÓN IA
                        
                        if (this.logoFile) form.append('logo', this.logoFile);

                        const response = await fetch(`${API_URL}/dashboard/site/${this.siteId}/update-design`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${this.user.token}` },
                            body: form
                        });

                        const data = await response.json();
                        if(response.ok) {
                            Swal.fire({ icon: 'success', title: 'Diseño Actualizado', timer: 2000, showConfirmButton: false });
                            this.logoFile = null;
                            await this.loadSiteData();
                        } else {
                            alert(data.message || 'Error al guardar el diseño.');
                        }
                    } catch (error) { alert('Error de red al subir la imagen.'); }
                    this.isSaving = false;
                },

                async regenerateAi() {
                    if(!confirm('¡ADVERTENCIA DE DESTRUCCIÓN!\n\nEsto borrará la arquitectura web actual y la IA generará una estructura totalmente nueva basándose en tu texto. \n\n¡Tranquilo! Tus productos y ventas no se verán afectados. ¿Quieres detonar el proceso?')) return;
                    
                    this.isRegenerating = true;
                    try {
                        const res = await WuepyAPI.fetch(`/dashboard/site/${this.siteId}/regenerate-ai`, {
                            method: 'POST', body: JSON.stringify({ aiPrompt: this.aiPromptInput })
                        });

                        if(res.status === 200) {
                            Swal.fire({ icon: 'success', title: '¡Mutación Completada!', text: 'El Orquestador ha forjado una web completamente nueva. Ve a mirarla.', confirmButtonColor: '#4f46e5' });
                            await this.loadSiteData();
                        } else {
                            Swal.fire({ icon: 'error', title: 'Fallo en la Matriz', text: res.data?.message || 'La IA no pudo regenerar el diseño.' });
                        }
                    } catch (error) { 
                        alert('Error de conexión con el Orquestador.'); 
                    }
                    this.isRegenerating = false;
                },

                async addEmployee() {
                    this.isSaving = true;
                    try {
                        const payload = { ...this.newEmployee };
                        const res = await WuepyAPI.fetch(`/dashboard/site/${this.siteId}/employees/add`, {
                            method: 'POST', body: JSON.stringify(payload)
                        });

                        if(res.status === 200 || res.status === 201) {
                            Swal.fire({ icon: 'success', title: 'Empleado Agregado', timer: 2000, showConfirmButton: false });
                            this.showAddEmployeeModal = false;
                            this.newEmployee = { name: '', email: '', password: '', role: 'cajero' };
                            await this.loadSiteData();
                        } else {
                            alert(res.data?.message || 'Error al agregar empleado.');
                        }
                    } catch (error) { alert('Error de conexión.'); }
                    this.isSaving = false;
                },

                async removeEmployee(employeeId) {
                    if(confirm('¿Estás seguro de eliminar a este empleado? Perderá acceso a la caja y al inventario inmediatamente.')) {
                        try {
                            const res = await WuepyAPI.fetch(`/dashboard/site/${this.siteId}/employees/delete/${employeeId}`, {
                                method: 'POST'
                            });

                            if(res.status === 200) {
                                Swal.fire({ icon: 'success', title: 'Eliminado', text: 'Acceso revocado con éxito.', timer: 1500, showConfirmButton: false });
                                await this.loadSiteData();
                            } else {
                                alert(res.data?.message || 'Error al eliminar.');
                            }
                        } catch (error) { alert('Error de conexión.'); }
                    }
                }
            }));
        });
    </script>
</body>
</html>
