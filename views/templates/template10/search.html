<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>
        body { background: #fff6e8; color: #431407; font-family: Nunito, sans-serif; }
        .serif { font-family: Fraunces, serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="searchPage()" x-cloak>
    <header class="border-b border-dashed border-[#e11d48]/40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="serif text-2xl" x-text="site?.name || 'Feria'"></a>
            <a :href="waLink()" class="font-extrabold text-sm">WhatsApp</a>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-3">
            <form action="search.html" method="GET" class="mb-4">
                <input name="q" :value="searchQuery" placeholder="Buscar en la feria" class="w-full border-2 border-[#431407] rounded-2xl px-4 py-3 bg-white outline-none">
            </form>
            <div class="flex lg:flex-col gap-2 overflow-x-auto">
                <a href="search.html" class="px-4 py-2 rounded-full text-sm font-extrabold whitespace-nowrap" :class="!currentCategory ? 'bg-[#e11d48] text-white' : 'bg-white'">Todo</a>
                <template x-for="cat in categories" :key="cat">
                    <a :href="'search.html?category=' + encodeURIComponent(cat)" class="px-4 py-2 rounded-full text-sm font-extrabold whitespace-nowrap" :class="currentCategory === cat ? 'bg-[#431407] text-[#fff6e8]' : 'bg-white'" x-text="cat"></a>
                </template>
            </div>
        </aside>
        <section class="lg:col-span-9">
            <h1 class="serif text-4xl mb-6" x-text="searchQuery ? ('Resultados: ' + searchQuery) : (currentCategory || 'Todos los puestos')"></h1>
            <p x-show="!isLoading && filteredProducts.length === 0" class="border-2 border-dashed rounded-3xl p-10 text-center">No hay nada con esa búsqueda.</p>
            <div class="flex flex-col gap-3">
                <template x-for="product in filteredProducts" :key="product._id">
                    <a :href="'product.html?id=' + product._id" class="flex items-center gap-4 bg-white rounded-2xl px-3 py-3 border border-[#431407]/10">
                        <div class="w-16 h-16 rounded-2xl bg-[#ffe4e6] overflow-hidden shrink-0 flex items-center justify-center">
                            <img x-show="photo(product.imageUrl)" :src="photo(product.imageUrl)" class="w-full h-full object-cover">
                            <i x-show="!photo(product.imageUrl)" class="fas fa-tag text-[#e11d48]"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] uppercase font-extrabold text-[#e11d48]" x-text="product.category || 'General'"></p>
                            <h2 class="serif text-xl truncate" x-text="product.name"></h2>
                        </div>
                        <div class="text-right">
                            <p class="font-extrabold" x-text="formatMoney(product.price)"></p>
                            <p class="text-xs" x-text="product.stock <= 0 ? 'Agotado' : 'Disponible'"></p>
                        </div>
                    </a>
                </template>
            </div>
        </section>
    </main>
    <p class="text-center text-sm pb-8">¿Querés una feria así? <a href="https://www.wuepy.com" target="_top" class="font-extrabold text-[#e11d48]">Crear mi tienda ahora</a></p>
</body>
</html>
