<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>
        :root { --wuepy-primary: #e11d48; --wuepy-secondary: #431407; }
        body { background: #fff6e8; color: #431407; font-family: Nunito, sans-serif; }
        .serif { font-family: Fraunces, serif; }
        .ticket { background: repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(225,29,72,.15) 8px, rgba(225,29,72,.15) 9px); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="storefrontApp()" x-cloak>
    <header class="sticky top-0 z-40 bg-[#fff6e8]/90 backdrop-blur border-b border-dashed border-[#e11d48]/40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-4">
            <a href="index.html" class="serif text-2xl font-extrabold tracking-tight" x-text="site?.name || 'Feria'"></a>
            <form action="search.html" method="GET" class="hidden md:flex flex-1 max-w-md ml-auto">
                <input name="q" placeholder="¿Qué puesto buscás?" class="w-full bg-white border border-[#431407] rounded-l-full px-4 py-2 text-sm outline-none">
                <button class="bg-[#e11d48] text-white px-4 rounded-r-full font-extrabold text-sm">Ir</button>
            </form>
            <a :href="waLink()" class="ml-auto md:ml-0 text-sm font-extrabold border-2 border-[#431407] rounded-full px-3 py-1">WhatsApp</a>
            <button class="md:hidden" @click="mobileMenu = !mobileMenu"><i class="fas fa-bars"></i></button>
        </div>
        <div x-show="mobileMenu" class="md:hidden px-4 pb-4 flex flex-col gap-2">
            <a href="search.html" class="font-extrabold">Ver puestos</a>
            <a :href="waLink()">Hablar por WhatsApp</a>
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-4 py-10 grid lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5">
            <p class="uppercase tracking-[0.3em] text-xs font-extrabold text-[#e11d48]">Puesto abierto</p>
            <h1 class="serif text-5xl md:text-7xl leading-[0.9] mt-3" x-text="site?.content?.heroTitle || 'La feria de hoy'"></h1>
            <p class="mt-4 text-lg max-w-md" x-text="site?.content?.heroSubtitle || 'Cada producto es un puesto. Mirá el precio, entrá a la ficha y pedilo por WhatsApp.'"></p>
            <a href="search.html" class="inline-block mt-6 bg-[#431407] text-[#fff6e8] px-6 py-3 rounded-full font-extrabold">Recorrer la feria</a>
        </div>
        <div class="lg:col-span-7 relative">
            <div class="absolute -top-4 -right-2 w-24 h-24 rounded-full border-4 border-dashed border-[#e11d48] flex items-center justify-center serif text-center text-sm leading-tight rotate-12 bg-[#fff6e8]">hoy<br>hay stock</div>
            <div class="ticket rounded-[2rem] border-2 border-[#431407] p-6 min-h-[220px]">
                <p class="serif text-3xl" x-text="site?.name || 'Tu feria'"></p>
                <p class="mt-2 opacity-70" x-text="site?.content?.aboutText || 'Un mercado con catálogo, búsqueda y ficha de cada producto.'"></p>
            </div>
        </div>
    </section>

    <section id="destacados" class="max-w-6xl mx-auto px-4 pb-16">
        <div class="flex items-end justify-between mb-6">
            <h2 class="serif text-4xl">Puestos</h2>
            <a href="search.html" class="font-extrabold text-[#e11d48]">Ver todos</a>
        </div>
        <template x-if="products.length === 0">
            <p class="border-2 border-dashed border-[#431407] rounded-3xl p-10 text-center">Todavía no hay productos en la feria.</p>
        </template>
        <div class="grid md:grid-cols-2 gap-4" x-show="products.length">
            <template x-for="product in products.slice(0, 8)" :key="product._id">
                <a :href="'product.html?id=' + product._id" class="flex gap-4 bg-white rounded-[1.6rem] p-3 border border-[#431407]/15 hover:-translate-y-0.5 transition">
                    <div class="w-24 h-24 shrink-0 rounded-full overflow-hidden bg-[#ffe4e6] flex items-center justify-center">
                        <img x-show="photo(product.imageUrl)" :src="photo(product.imageUrl)" class="w-full h-full object-cover" :alt="product.name">
                        <i x-show="!photo(product.imageUrl)" class="fas fa-store text-[#e11d48] text-2xl"></i>
                    </div>
                    <div class="min-w-0 flex-1 py-1">
                        <p class="text-[10px] uppercase tracking-widest font-extrabold text-[#e11d48]" x-text="product.category || 'General'"></p>
                        <h3 class="serif text-xl truncate" x-text="product.name"></h3>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="font-extrabold" x-text="formatMoney(product.price)"></span>
                            <span class="text-xs font-extrabold" x-text="product.stock <= 0 ? 'Agotado' : 'Pedir'"></span>
                        </div>
                    </div>
                </a>
            </template>
        </div>
    </section>

    <section class="px-4 pb-12">
        <div class="max-w-6xl mx-auto bg-[#431407] text-[#fff6e8] rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <p class="serif text-3xl">¿Te gusta esta feria?</p>
                <p class="opacity-80">Crea tu tienda con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="http://lfaftech.com" class="bg-[#e11d48] text-white px-6 py-3 rounded-full font-extrabold">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
