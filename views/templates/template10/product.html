<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>
        body { background: #fff6e8; color: #431407; font-family: Nunito, sans-serif; }
        .serif { font-family: Fraunces, serif; }
        .ruled { background-image: repeating-linear-gradient(#fff6e8, #fff6e8 27px, rgba(67,20,7,.15) 28px); line-height: 28px; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="productPage()" x-cloak>
    <header class="border-b border-dashed border-[#e11d48]/40">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="serif text-2xl" x-text="site?.name || 'Feria'"></a>
            <a href="search.html" class="font-extrabold text-sm">Volver a la feria</a>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-10" x-show="product">
        <div class="grid md:grid-cols-2 gap-10 items-center">
            <div class="aspect-square rounded-full overflow-hidden bg-[#ffe4e6] border-8 border-white shadow-xl flex items-center justify-center">
                <img x-show="photo(product?.imageUrl)" :src="photo(product?.imageUrl)" class="w-full h-full object-cover" :alt="product?.name">
                <i x-show="!photo(product?.imageUrl)" class="fas fa-store text-6xl text-[#e11d48]"></i>
            </div>
            <div>
                <p class="uppercase tracking-[0.25em] text-xs font-extrabold text-[#e11d48]" x-text="product?.category || 'Puesto'"></p>
                <h1 class="serif text-5xl leading-none mt-2" x-text="product?.name"></h1>
                <p class="serif text-3xl mt-4" x-text="formatMoney(product?.price)"></p>
                <p class="ruled mt-6" x-text="product?.description || 'Pedilo directo. Te respondemos por WhatsApp.'"></p>
                <a :href="waLink(product)" class="inline-flex mt-8 bg-[#e11d48] text-white px-6 py-3 rounded-full font-extrabold items-center gap-2">
                    <i class="fab fa-whatsapp"></i> Pedir este puesto
                </a>
                <p class="text-sm mt-3" x-show="product && product.stock <= 0">Este producto está agotado.</p>
            </div>
        </div>
        <div class="mt-14" x-show="relatedProducts.length">
            <h2 class="serif text-3xl mb-4">También en la feria</h2>
            <div class="grid sm:grid-cols-2 gap-3">
                <template x-for="rel in relatedProducts" :key="rel._id">
                    <a :href="'product.html?id=' + rel._id" class="flex items-center justify-between bg-white rounded-2xl px-4 py-3">
                        <span class="serif" x-text="rel.name"></span>
                        <span class="font-extrabold" x-text="formatMoney(rel.price)"></span>
                    </a>
                </template>
            </div>
        </div>
    </main>
    <p class="text-center pb-10">¿Te gusta esta ficha? <a href="http://lfaftech.com" class="font-extrabold text-[#e11d48]">Crear mi tienda ahora</a></p>
</body>
</html>
