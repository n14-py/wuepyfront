<!DOCTYPE html>
<html lang="es" data-wuepy-template="template30">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/storefront.js"></script>
<style>:root{--brand:#4f46e5} body{font-family:Georgia,serif;background:#000;color:#fff;margin:0} a{color:inherit} .brand{color:var(--brand)} .bg-brand{background:var(--brand);color:#fff}</style>
</head>
<body x-data="shop()" x-cloak>

<header style="padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid currentColor">
  <a href="index.html" style="font-size:28px;font-weight:800;text-decoration:none"><span x-show="site?.logoUrl"><img :src="site.logoUrl" alt="" style="height:42px;vertical-align:middle;margin-right:8px"></span><span x-text="site?.name || 'Cine'"></span></a>
  <nav style="display:flex;gap:16px"><a href="search.html">Catálogo</a><a class="bg-brand" style="padding:8px 14px;text-decoration:none" :href="wa('Hola')">WhatsApp</a></nav>
</header>
<main style="padding:28px;max-width:1100px;margin:auto">
  <p style="letter-spacing:.2em;text-transform:uppercase;font-size:12px">Cine</p>
  <h1 style="font-size:56px;line-height:.95;margin:8px 0" x-text="site?.content?.heroTitle || site?.name"></h1>
  <p style="font-size:18px;max-width:640px" x-text="site?.content?.aboutText || site?.content?.heroSubtitle || 'Productos listos para encargar por WhatsApp.'"></p>
  <p x-show="site?.contact?.address" x-text="site.contact.address"></p>
  <section style="margin-top:28px"><div style="display:grid;grid-template-columns:1fr"><template x-for="p in products" :key="p._id"><a :href="'product.html?id='+p._id" style="display:block;min-height:220px;margin:8px 0;background:#111 center/cover" :style="img(p)?'background-image:url('+img(p)+')':''"><span style="display:block;background:linear-gradient(transparent,#000);padding:80px 20px 20px;font-size:28px" x-text="p.name+' · '+money(p.price)"></span></a></template></div></section>
</main>
</body></html>
