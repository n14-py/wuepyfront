<!DOCTYPE html>
<html lang="es" data-wuepy-template="template30">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/storefront.js"></script>
<style>:root{--brand:#4f46e5} body{font-family:Georgia,serif;background:#000;color:#fff;margin:0} a{color:inherit} .brand{color:var(--brand)} .bg-brand{background:var(--brand);color:#fff}</style>
</head>
<body x-data="shop()" x-cloak>

<a href="index.html" style="display:inline-block;margin:16px">← <span x-text="site?.name || 'Cine'"></span></a>
<article style="max-width:900px;margin:auto;padding:24px;display:grid;gap:20px" x-show="product">
  <img :src="img(product)" alt="" style="width:100%;max-height:460px;object-fit:cover;border:4px solid currentColor" x-show="img(product)">
  <h1 style="font-size:48px;margin:0" x-text="product?.name"></h1>
  <p class="brand" style="font-size:32px" x-text="money(product?.price)"></p>
  <p x-text="product?.description"></p>
  <a class="bg-brand" style="display:inline-block;padding:14px 18px;text-decoration:none;width:max-content" :href="wa(product?.name)">Pedir por WhatsApp</a>
</article></body></html>
