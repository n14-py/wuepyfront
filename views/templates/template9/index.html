<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,700&display=swap');
        :root {
            /* Por defecto: Rojo Intenso y Gris Carbón */
            --primary: #ef4444; 
            --secondary: #111827;
        }
        body { font-family: 'Roboto', sans-serif; color: var(--secondary); background-color: #f3f4f6; }
        .font-power { font-family: 'Oswald', sans-serif; }
        
        .btn-power {
            background-color: var(--primary);
            color: white;
            box-shadow: 6px 6px 0px var(--secondary);
            transition: all 0.2s ease;
        }
        .btn-power:hover {
            transform: translate(2px, 2px) skewX(-12deg) !important;
            box-shadow: 4px 4px 0px var(--secondary);
        }
        .btn-power:active {
            transform: translate(6px, 6px) skewX(-12deg) !important;
            box-shadow: 0px 0px 0px var(--secondary);
        }
        
        /* Textura de puntitos */
        .dot-pattern {
            background-image: radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 15px 15px;
            opacity: 0.1;
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="flex flex-col min-h-screen" x-data="storefrontApp()" x-cloak>
    
    
<header class="bg-[var(--secondary)] border-b-4 border-[var(--primary)] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="font-power text-3xl italic uppercase text-white tracking-widest transform -skew-x-12">
                    <template x-if="site?.logoUrl"><div class="contents">
                        <img class="h-12 w-auto" :src="site?.logoUrl" :alt="site?.name">
                    </div></template><template x-if="!(site?.logoUrl)"><div class="contents">
                        <span x-text="site?.name"></span>
                    </div></template>
                </a>
            </div>
            
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="font-power text-xl uppercase italic text-gray-300 hover:text-[var(--primary)] transition-colors transform -skew-x-6">Home</a>
                <a href="search.html" class="font-power text-xl uppercase italic text-gray-300 hover:text-[var(--primary)] transition-colors transform -skew-x-6">Catálogo</a>
            </nav>
            
            <div class="flex items-center space-x-6">
                <a href="search.html" class="text-white hover:text-[var(--primary)] transition-colors text-2xl">
                    <i class="fas fa-search"></i>
                </a>
                <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                <a :href="waLink()" target="_blank" class="bg-[var(--primary)] text-white px-6 py-2 font-power text-xl uppercase italic tracking-wider hover:scale-105 transition-transform transform -skew-x-12 shadow-[4px_4px_0_rgba(255,255,255,0.2)]">
                    <i class="fab fa-whatsapp mr-1"></i> Contacto
                </a>
                </div></template>
            </div>
        </div>
    </div>
</header>


    <section class="relative bg-[var(--secondary)] min-h-[85vh] flex items-center overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-40">
            <template x-if="site?.bannerUrl && site?.bannerUrl !== ''"><div class="contents">
                <img :src="site?.bannerUrl" class="w-full h-full object-cover filter grayscale contrast-150" alt="Banner">
            </div></template><template x-if="!(site?.bannerUrl && site?.bannerUrl !== '')"><div class="contents">
                <div class="w-full h-full bg-black"></div>
            </div></template>
            <div class="absolute inset-0" style="background: linear-gradient(105deg, var(--secondary) 0%, transparent 60%, var(--primary) 100%); mix-blend-mode: multiply;"></div>
        </div>
        
        <div class="dot-pattern absolute inset-0 z-0 pointer-events-none"></div>

        <div class="relative z-10 max-w-7xl mx-auto px-4 w-full pt-10">
            <div class="inline-block bg-[var(--primary)] text-white font-power text-2xl uppercase italic px-4 py-1 transform -skew-x-12 shadow-[4px_4px_0_#fff] mb-6">
                Sube de nivel
            </div>
            
            <h1 class="text-6xl md:text-8xl lg:text-[10rem] font-power font-bold text-white uppercase italic leading-[0.85] tracking-tighter mb-6 drop-shadow-2xl">
                <span x-text="site?.content?.heroTitle || 'ROMPE TUS LÍMITES'"></span>
            </h1>
            
            <p class="text-xl md:text-3xl text-gray-300 font-bold uppercase mb-10 max-w-2xl border-l-4 border-[var(--primary)] pl-4">
                <span x-text="site?.content?.heroSubtitle || 'El equipamiento definitivo para verdaderos atletas.'"></span>
            </p>
            
            <a href="search.html" class="inline-block btn-power px-12 py-4 font-power text-3xl uppercase italic tracking-widest transform -skew-x-12">
                VER EQUIPAMIENTO <i class="fas fa-bolt ml-2 text-yellow-300"></i>
            </a>
        </div>
    </section>

    <div class="bg-[var(--primary)] border-y-4 border-[var(--secondary)] py-4 overflow-hidden flex whitespace-nowrap text-[var(--secondary)] font-power text-3xl italic font-bold uppercase">
        <div class="animate-marquee inline-block">
            <template x-for="i in 8" :key="i"><div class="contents">
                <span>&nbsp;/// FUERZA /// RESISTENCIA /// POTENCIA /// DISCIPLINA ///&nbsp;</span>
            </div></template>
        </div>
    </div>
    <style>
        .animate-marquee { animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    </style>

    <section class="py-24 px-4 bg-gray-100 relative">
        <div class="absolute top-0 right-0 w-64 h-full bg-white transform skew-x-12 translate-x-32 z-0"></div>
        
        <div class="max-w-7xl mx-auto relative z-10">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 border-b-4 border-[var(--secondary)] pb-2">
                <h2 class="text-5xl md:text-6xl font-power font-bold italic uppercase tracking-tighter" style="color: var(--secondary);">
                    <span class="text-[var(--primary)]">Top</span> Ventas
                </h2>
                <a href="search.html" class="font-power text-2xl italic uppercase hover:text-[var(--primary)] transition-colors mt-4 md:mt-0">Ver todo [+]</a>
            </div>

            <template x-if="products.length === 0"><div class="contents">
                <div class="bg-white border-4 border-[var(--secondary)] p-16 text-center transform -skew-x-2">
                    <i class="fas fa-dumbbell text-6xl text-gray-300 mb-4 block"></i>
                    <h3 class="font-power text-4xl text-gray-400 uppercase italic">EQUIPANDO EL INVENTARIO...</h3>
                </div>
            </div></template><template x-if="!(products.length === 0)"><div class="contents">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                    <template x-for="product in products" :key="product?._id"><div class="contents">
                        <div class="bg-white border-4 border-[var(--secondary)] overflow-hidden group flex flex-col transform transition-transform hover:-translate-y-2 hover:shadow-[8px_8px_0_var(--primary)]">
                            
                            <a :href="'product.html?id=' + product?._id" class="relative h-64 bg-gray-200 block overflow-hidden">
                                <template x-if="product?.imageUrl"><div class="contents">
                                    <img :src="product?.imageUrl" class="w-full h-full object-cover filter contrast-125 group-hover:scale-110 transition-transform duration-500" :alt="product?.name">
                                </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                                    <div class="w-full h-full flex items-center justify-center text-gray-400"><i class="fas fa-burn text-5xl"></i></div>
                                </div></template>
                                
                                <div class="absolute top-3 left-3 bg-[var(--primary)] text-white font-power italic text-lg px-3 uppercase border-2 border-[var(--secondary)] transform -skew-x-12">
                                    <span x-text="product?.category"></span>
                                </div>
                                
                                <template x-if="product?.stock <= 0"><div class="contents">
                                    <div class="absolute top-3 right-3 bg-black text-white font-power italic text-lg px-3 uppercase border-2 border-[var(--primary)] transform -skew-x-12">
                                        AGOTADO
                                    </div>
                                </div></template>
                            </a>
                            
                            <div class="p-5 flex flex-col flex-grow bg-white relative">
                                <h3 class="font-power font-bold text-2xl uppercase leading-tight mb-2 text-[var(--secondary)] line-clamp-2"><a :href="'product.html?id=' + product?._id"><span x-text="product?.name"></span></a></h3>
                                
                                <div class="mt-auto pt-4 flex items-center justify-between">
                                    <span class="font-power text-3xl font-bold italic" style="color: var(--primary);">
                                        <span x-text="formatMoney(product?.price)"></span>
                                    </span>
                                    <a :href="'product.html?id=' + product?._id" class="w-12 h-12 bg-[var(--secondary)] text-white flex items-center justify-center text-xl hover:bg-[var(--primary)] transition-colors transform -skew-x-6 border-2 border-[var(--secondary)]">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div></template>
                </div>
            </div></template>
        </div>
    </section>

    
<footer class="bg-[var(--secondary)] pt-16 pb-8 border-t-[10px] border-[var(--primary)] relative overflow-hidden">
    <div class="absolute inset-0 opacity-5 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz48cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjMDAwIi8+PC9zdmc+')]"></div>
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left mb-12">
            <div>
                <h3 class="font-power text-4xl uppercase italic text-white tracking-widest mb-4 transform -skew-x-6"><span x-text="site?.name"></span></h3>
                <p class="text-gray-400 font-bold max-w-sm mx-auto md:mx-0 uppercase">
                    <span x-text="site?.content?.aboutText || 'Supera tus límites. Equípate con lo mejor para alcanzar tu máximo rendimiento.'"></span>
                </p>
            </div>
            
            <div>
                <h4 class="font-power text-2xl uppercase italic text-[var(--primary)] tracking-wider mb-6 transform -skew-x-6">Base de Operaciones</h4>
                <ul class="space-y-3 text-white font-bold uppercase text-sm">
                    <li><i class="fas fa-map-marker-alt text-[var(--primary)] w-6"></i> <span x-text="site?.contact?.address || 'Gimnasio Central'"></span></li>
                    <li><i class="fas fa-clock text-[var(--primary)] w-6"></i> <span x-text="site?.contact?.schedule || 'Entrena sin parar'"></span></li>
                </ul>
            </div>
            
            <div>
                <h4 class="font-power text-2xl uppercase italic text-[var(--primary)] tracking-wider mb-6 transform -skew-x-6">Súmate al Equipo</h4>
                <div class="flex justify-center md:justify-start space-x-4">
                    <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="w-12 h-12 bg-white text-[var(--secondary)] flex items-center justify-center text-2xl hover:bg-[var(--primary)] hover:text-white transition-all transform -skew-x-12"><i class="fab fa-instagram"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="w-12 h-12 bg-white text-[var(--secondary)] flex items-center justify-center text-2xl hover:bg-[var(--primary)] hover:text-white transition-all transform -skew-x-12"><i class="fab fa-facebook-f"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="w-12 h-12 bg-white text-[var(--secondary)] flex items-center justify-center text-2xl hover:bg-[var(--primary)] hover:text-white transition-all transform -skew-x-12"><i class="fab fa-tiktok"></i></a></div></template>
                </div>
            </div>
        </div>
        
        <div class="border-t-2 border-gray-800 pt-8 text-center text-gray-500 font-power text-xl uppercase tracking-widest italic">
            <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>. NO PAIN, NO GAIN.</p>
        </div>
    </div>
</footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="https://www.wuepy.com" target="_top" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
