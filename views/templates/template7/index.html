<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap');
        :root {
            /* Por defecto: Naranja apetitoso y Gris oscuro */
            --primary: #ea580c; 
            --secondary: #292524;
        }
        body { font-family: 'Inter', sans-serif; color: var(--secondary); background-color: #fafaf9; }
        .font-lora { font-family: 'Lora', serif; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="flex flex-col min-h-screen" x-data="storefrontApp()" x-cloak>
    
    
<header class="bg-white shadow-sm sticky top-0 z-50 border-b-4" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="font-lora text-2xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
                    <template x-if="site?.logoUrl"><div class="contents">
                        <img class="h-12 w-auto rounded" :src="site?.logoUrl" :alt="site?.name">
                    </div></template>
                    <span><span x-text="site?.name"></span></span>
                </a>
            </div>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Inicio</a>
                <a href="search.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Ver Menú</a>
            </nav>
            <div class="flex items-center">
                <a href="search.html" class="p-2 text-gray-400 hover:text-[var(--primary)] transition-colors">
                    <i class="fas fa-search text-xl"></i>
                </a>
                <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                <a :href="waLink()" target="_blank" class="ml-4 bg-[var(--primary)] text-white px-5 py-2.5 rounded-full font-bold shadow hover:shadow-lg hover:opacity-90 transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fab fa-whatsapp text-lg"></i> Pedir
                </a>
                </div></template>
            </div>
        </div>
    </div>
</header>


    <section class="relative bg-black h-[75vh] flex items-center justify-center overflow-hidden">
        <template x-if="site?.bannerUrl && site?.bannerUrl !== ''"><div class="contents">
            <img :src="site?.bannerUrl" class="absolute inset-0 w-full h-full object-cover opacity-60 filter brightness-75" alt="Banner">
        </div></template><template x-if="!(site?.bannerUrl && site?.bannerUrl !== '')"><div class="contents">
            <div class="absolute inset-0 bg-gradient-to-tr from-[#292524] to-[#44403c] opacity-90"></div>
            <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/food.png')]"></div>
        </div></template>
        
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
            <span class="font-lora italic text-[var(--primary)] text-xl md:text-3xl mb-4 block drop-shadow">Sabor incomparable</span>
            <h1 class="text-6xl md:text-8xl font-lora font-bold text-white mb-6 leading-tight drop-shadow-2xl">
                <span x-text="site?.content?.heroTitle || 'Experiencia Gourmet'"></span>
            </h1>
            <p class="text-lg md:text-xl text-gray-200 mb-10 font-light max-w-2xl mx-auto drop-shadow-lg">
                <span x-text="site?.content?.heroSubtitle || 'Disfruta de nuestros platillos y productos elaborados con la más alta calidad, frescura y pasión.'"></span>
            </p>
            <a href="search.html" class="inline-block bg-[var(--primary)] text-white px-10 py-4 rounded-full font-bold text-lg hover:brightness-110 transition-all shadow-[0_10px_25px_rgba(0,0,0,0.5)] transform hover:-translate-y-1">
                Ver Nuestro Menú <i class="fas fa-utensils ml-2"></i>
            </a>
        </div>
    </section>

    <section class="py-24 px-4 max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <p class="text-[var(--primary)] font-bold tracking-widest uppercase text-sm mb-2">Recomendaciones</p>
            <h2 class="text-4xl md:text-5xl font-lora font-bold mb-6 text-gray-900">Especialidades de la Casa</h2>
            <div class="w-20 h-1 bg-[var(--primary)] mx-auto rounded-full"></div>
        </div>

        <template x-if="products.length === 0"><div class="contents">
            <div class="bg-white rounded-3xl p-16 text-center shadow-sm border border-gray-100">
                <i class="fas fa-concierge-bell text-6xl text-gray-300 mb-6 block"></i>
                <h3 class="font-lora text-2xl text-gray-500">Estamos cocinando nuestro menú...</h3>
            </div>
        </div></template><template x-if="!(products.length === 0)"><div class="contents">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <template x-for="product in products.slice(0, 8)" :key="product?._id"><div class="contents">
                    <div class="bg-white rounded-3xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 group flex flex-col border border-gray-100">
                        <a :href="'product.html?id=' + product?._id" class="relative h-64 overflow-hidden bg-gray-100 block">
                            <template x-if="product?.imageUrl"><div class="contents">
                                <img :src="product?.imageUrl" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" :alt="product?.name">
                            </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                                <div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fas fa-camera text-4xl"></i></div>
                            </div></template>
                            
                            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider text-[var(--primary)] shadow-sm">
                                <span x-text="product?.category"></span>
                            </div>
                        </a>
                        
                        <div class="p-6 text-center flex flex-col flex-grow">
                            <h3 class="font-lora font-bold text-2xl mb-2 text-gray-900 line-clamp-1 group-hover:text-[var(--primary)] transition-colors"><span x-text="product?.name"></span></h3>
                            <p class="text-sm text-gray-500 line-clamp-2 mb-4 flex-grow"><span x-text="product?.description || 'Delicioso...'"></span></p>
                            
                            <p class="text-2xl font-black text-gray-900 mb-5">
                                <span x-text="formatMoney(product?.price)"></span>
                            </p>
                            
                            <a :href="'product.html?id=' + product?._id" class="block w-full py-3 border-2 border-[var(--primary)] text-[var(--primary)] rounded-full font-bold hover:bg-[var(--primary)] hover:text-white transition-colors">
                                Ver Detalles
                            </a>
                        </div>
                    </div>
                </div></template>
            </div>
            
            <div class="mt-16 text-center">
                <a href="search.html" class="inline-flex items-center gap-2 text-gray-600 font-bold hover:text-[var(--primary)] text-lg transition-colors">
                    Ver catálogo completo <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div></template>
    </section>

    
<footer class="bg-gray-900 text-white pt-16 pb-8 border-t-[8px]" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left">
            <div>
                <h3 class="font-lora text-3xl font-bold mb-4" style="color: var(--primary);"><span x-text="site?.name"></span></h3>
                <p class="text-gray-400 font-light max-w-sm mx-auto md:mx-0 leading-relaxed">
                    <span x-text="site?.content?.aboutText || 'Ingredientes frescos, sabor auténtico y la mejor calidad directa a tu mesa. Cocinamos con pasión.'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Horarios y Ubicación</h4>
                <p class="text-gray-400 mb-3 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-map-marker-alt text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.address || 'Local Principal, Ciudad'"></span>
                </p>
                <p class="text-gray-400 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-clock text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.schedule || 'Abierto de Lunes a Domingo'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Síguenos</h4>
                <div class="flex justify-center md:justify-start space-x-4">
                    <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-instagram"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-facebook-f"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-tiktok"></i></a></div></template>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-500 text-sm font-light">
            <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="https://www.wuepy.com" target="_top" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
