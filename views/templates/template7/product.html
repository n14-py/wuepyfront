<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap');
        :root {
            --primary: #ea580c; 
            --secondary: #292524;
        }
        body { font-family: 'Inter', sans-serif; color: var(--secondary); background-color: #fafaf9; }
        .font-lora { font-family: 'Lora', serif; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="flex flex-col min-h-screen" x-data="productPage()" x-cloak>
    
<header class="bg-white shadow-sm sticky top-0 z-50 border-b-4" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="font-lora text-2xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
                    <template x-if="site?.logoUrl"><div class="contents">
                        <img class="h-12 w-auto rounded" :src="site?.logoUrl" :alt="site?.name">
                    </div></template>
                    <span><span x-text="site?.name"></span></span>
                </a>
            </div>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Inicio</a>
                <a href="search.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Ver Menú</a>
            </nav>
            <div class="flex items-center">
                <a href="search.html" class="p-2 text-gray-400 hover:text-[var(--primary)] transition-colors">
                    <i class="fas fa-search text-xl"></i>
                </a>
                <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                <a :href="waLink(product)" target="_blank" class="ml-4 bg-[var(--primary)] text-white px-5 py-2.5 rounded-full font-bold shadow hover:shadow-lg hover:opacity-90 transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fab fa-whatsapp text-lg"></i> Pedir
                </a>
                </div></template>
            </div>
        </div>
    </div>
</header>


    <main class="flex-grow max-w-6xl mx-auto px-4 py-12 w-full">
        <a href="search.html" class="inline-flex items-center gap-2 text-gray-500 hover:text-[var(--primary)] mb-8 font-medium transition-colors">
            <i class="fas fa-arrow-left"></i> Volver al Menú
        </a>

        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100">
            <div class="grid grid-cols-1 lg:grid-cols-2">
                <div class="h-[400px] lg:h-auto bg-gray-50 relative p-8 flex items-center justify-center">
                    <template x-if="product?.imageUrl"><div class="contents">
                        <img :src="product?.imageUrl" class="max-w-full max-h-full object-cover rounded-2xl shadow-lg" :alt="product?.name">
                    </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                        <div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fas fa-image text-6xl"></i></div>
                    </div></template>
                </div>
                
                <div class="p-10 lg:p-16 flex flex-col justify-center bg-white">
                    <span class="text-[var(--primary)] font-black tracking-widest text-xs uppercase mb-3 block"><span x-text="product?.category"></span></span>
                    
                    <h1 class="text-4xl lg:text-5xl font-lora font-bold text-gray-900 mb-4 leading-tight"><span x-text="product?.name"></span></h1>
                    
                    <p class="text-4xl font-black text-gray-900 mb-8">
                        <span x-text="formatMoney(product?.price)"></span>
                    </p>
                    
                    <div class="text-gray-600 mb-10 font-light leading-relaxed text-lg border-t border-b border-gray-100 py-6">
                        <span x-text="product?.description || 'Una deliciosa opción preparada con los mejores ingredientes, pensando en tu paladar.'"></span>
                    </div>
                    
                    <template x-if="product?.stock > 0"><div class="contents">
                        <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                            <a :href="waLink(product)" target="_blank" class="bg-[#25D366] text-white px-8 py-4 rounded-full font-bold text-center text-lg hover:bg-[#128C7E] transition-all shadow-[0_10px_20px_rgba(37,211,102,0.3)] transform hover:-translate-y-1 flex items-center justify-center gap-3">
                                <i class="fab fa-whatsapp text-2xl"></i> Pedir por WhatsApp
                            </a>
                        </div></template><template x-if="!(site?.contact && site?.contact?.whatsapp)"><div class="contents">
                            <button class="bg-gray-300 text-gray-500 px-8 py-4 rounded-full font-bold text-center text-lg cursor-not-allowed">
                                WhatsApp no configurado
                            </button>
                        </div></template>
                    </div></template><template x-if="!(product?.stock > 0)"><div class="contents">
                        <div class="bg-red-50 text-red-600 border border-red-200 px-8 py-4 rounded-full font-bold text-center text-lg">
                            Temporalmente Agotado
                        </div>
                    </div></template>
                </div>
            </div>
        </div>
        
        <template x-if="relatedProducts && relatedProducts.length > 0"><div class="contents">
        <div class="mt-24">
            <h3 class="font-lora text-3xl font-bold mb-10 text-center text-gray-900">Complementa tu pedido</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <template x-for="rel in relatedProducts" :key="rel?._id"><div class="contents">
                    <a :href="'product.html?id=' + rel?._id" class="block bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all border border-gray-100 group">
                        <div class="h-48 bg-gray-100 overflow-hidden">
                            <template x-if="rel?.imageUrl"><div class="contents"><img :src="rel?.imageUrl" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"></div></template>
                        </div>
                        <div class="p-5 text-center">
                            <h4 class="font-lora font-bold text-xl text-gray-900 truncate mb-2"><span x-text="rel?.name"></span></h4>
                            <p class="text-[var(--primary)] font-black"><span x-text="formatMoney(rel?.price)"></span></p>
                        </div>
                    </a>
                </div></template>
            </div>
        </div>
        </div></template>
    </main>

    
<footer class="bg-gray-900 text-white pt-16 pb-8 border-t-[8px]" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left">
            <div>
                <h3 class="font-lora text-3xl font-bold mb-4" style="color: var(--primary);"><span x-text="site?.name"></span></h3>
                <p class="text-gray-400 font-light max-w-sm mx-auto md:mx-0 leading-relaxed">
                    <span x-text="site?.content?.aboutText || 'Ingredientes frescos, sabor auténtico y la mejor calidad directa a tu mesa. Cocinamos con pasión.'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Horarios y Ubicación</h4>
                <p class="text-gray-400 mb-3 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-map-marker-alt text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.address || 'Local Principal, Ciudad'"></span>
                </p>
                <p class="text-gray-400 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-clock text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.schedule || 'Abierto de Lunes a Domingo'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Síguenos</h4>
                <div class="flex justify-center md:justify-start space-x-4">
                    <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-instagram"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-facebook-f"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-tiktok"></i></a></div></template>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-500 text-sm font-light">
            <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="https://www.wuepy.com" target="_top" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
