<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap');
        :root {
            --primary: #ea580c; 
            --secondary: #292524;
        }
        body { font-family: 'Inter', sans-serif; color: var(--secondary); background-color: #fafaf9; }
        .font-lora { font-family: 'Lora', serif; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="flex flex-col min-h-screen" x-data="searchPage()" x-cloak>
    
<header class="bg-white shadow-sm sticky top-0 z-50 border-b-4" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="font-lora text-2xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
                    <template x-if="site?.logoUrl"><div class="contents">
                        <img class="h-12 w-auto rounded" :src="site?.logoUrl" :alt="site?.name">
                    </div></template>
                    <span><span x-text="site?.name"></span></span>
                </a>
            </div>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Inicio</a>
                <a href="search.html" class="text-gray-600 hover:text-[var(--primary)] px-3 py-2 font-medium transition-colors">Ver Menú</a>
            </nav>
            <div class="flex items-center">
                <a href="search.html" class="p-2 text-gray-400 hover:text-[var(--primary)] transition-colors">
                    <i class="fas fa-search text-xl"></i>
                </a>
                <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                <a :href="waLink()" target="_blank" class="ml-4 bg-[var(--primary)] text-white px-5 py-2.5 rounded-full font-bold shadow hover:shadow-lg hover:opacity-90 transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fab fa-whatsapp text-lg"></i> Pedir
                </a>
                </div></template>
            </div>
        </div>
    </div>
</header>


    <div class="bg-[var(--secondary)] text-white py-20 text-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/food.png')]"></div>
        <div class="relative z-10">
            <h1 class="font-lora text-5xl md:text-6xl font-bold mb-4 drop-shadow-md">Nuestro Menú</h1>
            <p class="text-gray-300 max-w-2xl mx-auto font-light text-lg">Descubre la variedad de sabores que tenemos preparados para ti.</p>
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full flex flex-col lg:flex-row gap-10">
        
        <aside class="w-full lg:w-1/4">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm sticky top-28 border border-gray-100">
                <form action="search.html" method="GET" class="mb-8">
                    <div class="relative">
                        <input type="text" name="q" :value="searchQuery || ''" placeholder="Buscar sabor..." class="w-full pl-12 pr-4 py-3.5 rounded-full border border-gray-200 focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent outline-none bg-gray-50 text-sm font-medium">
                        <i class="fas fa-search absolute left-5 top-4 text-gray-400"></i>
                    </div>
                    <template x-if="currentCategory"><div class="contents"><input type="hidden" name="category" :value="currentCategory"></div></template>
                </form>

                <h3 class="font-lora text-2xl font-bold mb-6 text-gray-900">Categorías</h3>
                <ul class="space-y-2">
                    <li>
                        <a :href="'search.html' + (searchQuery ? '?q=' + searchQuery : '').replace('&q=', '?q=')" class="block py-3 px-5 rounded-xl transition-colors" :class="!currentCategory ? 'bg-[var(--primary)] text-white font-bold shadow-md' : 'text-gray-600 hover:bg-orange-50 hover:text-[var(--primary)]'">
                            Todo el menú
                        </a>
                    </li>
                    <template x-for="cat in categories" :key="cat"><div class="contents">
                        <li>
                            <a :href="'search.html?category=' + encodeURIComponent(cat) + (searchQuery ? '&q=' + encodeURIComponent(searchQuery) : '')" 
                               class="block py-3 px-5 rounded-xl transition-colors" :class="currentCategory === cat ? 'bg-[var(--primary)] text-white font-bold shadow-md' : 'text-gray-600 hover:bg-orange-50 hover:text-[var(--primary)]'">
                                <span x-text="cat"></span>
                            </a>
                        </li>
                    </div></template>
                </ul>
            </div>
        </aside>

        <div class="w-full lg:w-3/4">
            <template x-if="filteredProducts.length === 0"><div class="contents">
                <div class="bg-white rounded-[2rem] p-16 text-center shadow-sm border border-gray-100">
                    <i class="fas fa-search text-6xl text-gray-200 mb-6 block"></i>
                    <h2 class="font-lora text-3xl font-bold text-gray-900 mb-3">No hay resultados</h2>
                    <p class="text-gray-500 mb-8 text-lg">No encontramos platillos con esa búsqueda.</p>
                    <a href="search.html" class="inline-block px-8 py-3 border-2 border-[var(--primary)] text-[var(--primary)] rounded-full font-bold hover:bg-[var(--primary)] hover:text-white transition-colors">Ver todo el menú</a>
                </div>
            </div></template><template x-if="!(filteredProducts.length === 0)"><div class="contents">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <template x-for="product in filteredProducts" :key="product?._id"><div class="contents">
                        <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow flex flex-col border border-gray-100 group">
                            <a :href="'product.html?id=' + product?._id" class="h-56 bg-gray-100 relative block overflow-hidden">
                                <template x-if="product?.imageUrl"><div class="contents">
                                    <img :src="product?.imageUrl" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" :alt="product?.name">
                                </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                                    <div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fas fa-utensils text-4xl"></i></div>
                                </div></template>
                                <template x-if="product?.stock <= 0"><div class="contents">
                                    <span class="absolute top-3 right-3 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase">Agotado</span>
                                </div></template>
                            </a>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="font-lora font-bold text-xl mb-2 text-gray-900 line-clamp-1 group-hover:text-[var(--primary)] transition-colors"><span x-text="product?.name"></span></h3>
                                <p class="text-gray-500 text-sm line-clamp-2 mb-6 flex-grow"><span x-text="product?.description || 'Descripción del platillo no disponible...'"></span></p>
                                <div class="flex items-center justify-between mt-auto">
                                    <span class="font-black text-2xl text-[var(--primary)]">
                                        <span x-text="formatMoney(product?.price)"></span>
                                    </span>
                                    <a :href="'product.html?id=' + product?._id" class="w-12 h-12 rounded-full border-2 border-[var(--primary)] flex items-center justify-center text-[var(--primary)] hover:bg-[var(--primary)] hover:text-white transition-colors">
                                        <i class="fas fa-plus"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div></template>
                </div>
            </div></template>
        </div>
    </main>

    
<footer class="bg-gray-900 text-white pt-16 pb-8 border-t-[8px]" style="border-color: var(--primary);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left">
            <div>
                <h3 class="font-lora text-3xl font-bold mb-4" style="color: var(--primary);"><span x-text="site?.name"></span></h3>
                <p class="text-gray-400 font-light max-w-sm mx-auto md:mx-0 leading-relaxed">
                    <span x-text="site?.content?.aboutText || 'Ingredientes frescos, sabor auténtico y la mejor calidad directa a tu mesa. Cocinamos con pasión.'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Horarios y Ubicación</h4>
                <p class="text-gray-400 mb-3 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-map-marker-alt text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.address || 'Local Principal, Ciudad'"></span>
                </p>
                <p class="text-gray-400 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-clock text-[var(--primary)] text-lg"></i> 
                    <span x-text="site?.contact?.schedule || 'Abierto de Lunes a Domingo'"></span>
                </p>
            </div>
            <div>
                <h4 class="font-lora text-xl font-bold mb-6 text-white">Síguenos</h4>
                <div class="flex justify-center md:justify-start space-x-4">
                    <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-instagram"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-facebook-f"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl hover:bg-[var(--primary)] hover:text-white transition-all"><i class="fab fa-tiktok"></i></a></div></template>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-500 text-sm font-light">
            <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="https://www.wuepy.com" target="_top" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
