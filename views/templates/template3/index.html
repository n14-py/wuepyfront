<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        :root {
            /* Por defecto usa un amarillo urbano si el cliente no elige color */
            --primary: #facc15; 
            --secondary: #000000;
        }
        body {
            background-color: #f8f9fa;
            color: var(--secondary);
            font-family: 'Arial', sans-serif;
        }
        .bg-urban { background-color: var(--primary); }
        .text-urban { color: var(--primary); }
        
        /* Sombras estilo Neo-Brutalismo */
        .brutal-shadow {
            box-shadow: 6px 6px 0px 0px var(--secondary);
            transition: all 0.2s ease;
        }
        .brutal-shadow:hover {
            box-shadow: 10px 10px 0px 0px var(--secondary);
            transform: translate(-4px, -4px);
        }
        .brutal-button:active {
            box-shadow: 2px 2px 0px 0px var(--secondary);
            transform: translate(4px, 4px);
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="border-x-4 border-black max-w-[1600px] mx-auto bg-white min-h-screen flex flex-col" x-data="storefrontApp()" x-cloak>
    
    





<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { 
                    sans: ['Inter', 'sans-serif'],
                    display: ['Archivo', 'sans-serif']
                },
                colors: { 
                    brand: 'var(--wuepy-primary)',
                    dark: '#1a1a1a'
                },
                boxShadow: {
                    'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
                    'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                }
            }
        }
    }
</script>
<style>
    .text-brand { color: var(--wuepy-primary); }
    .bg-brand { background-color: var(--wuepy-primary); }
    .border-brand { border-color: var(--wuepy-primary); }
    
    /* Bordes y Sombras Estilo Bold */
    .btn-bold {
        background-color: var(--wuepy-primary);
        color: white;
        border: 2px solid black;
        box-shadow: 4px 4px 0px 0px black;
        transition: all 0.2s;
    }
    .btn-bold:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px black;
    }
    .btn-bold:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px 0px black;
    }
    
    .card-bold {
        background: white;
        border: 2px solid black;
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }
    .card-bold:hover {
        transform: translateY(-2px);
        box-shadow: 6px 6px 0px 0px rgba(0,0,0,0.2);
    }
</style>

<div>

    <div class="bg-black text-white text-xs font-bold py-2 border-b-2 border-black font-display tracking-widest uppercase">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="bg-brand text-black px-1">NUEVO</span>
                <span>Envíos a todo el país 🚀</span>
            </div>
            <div class="flex gap-4">
                <template x-if="site?.contact?.phone"><div class="contents"> <span><i class="fas fa-phone-alt mr-1"></i> <span x-text="site?.contact?.phone"></span></span> </div></template>
            </div>
        </div>
    </div>

    <header class="bg-white border-b-2 border-black sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-2 group">
                <template x-if="site?.logoUrl"><div class="contents">
                    <img :src="site?.logoUrl" class="h-12 w-auto object-contain border-2 border-black rounded shadow-hard-sm">
                </div></template><template x-if="!(site?.logoUrl)"><div class="contents">
                    <span class="text-3xl font-display font-black text-black tracking-tighter uppercase italic"><span x-text="site?.name"></span></span>
                </div></template>
            </a>

            <div class="hidden md:block flex-1 max-w-md mx-8">
                <form action="search.html" method="GET" class="relative">
                    <input type="text" name="q" placeholder="BUSCAR PRODUCTOS..." class="w-full bg-gray-50 border-2 border-black py-2.5 pl-4 pr-10 font-bold text-sm focus:outline-none focus:ring-0 focus:bg-white placeholder-gray-400 font-display uppercase">
                    <button type="submit" class="absolute right-0 top-0 h-full px-3 text-black hover:bg-brand border-l-2 border-black transition-colors">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>

            <div class="flex items-center gap-6">
                <nav class="hidden lg:flex items-center gap-6 font-bold text-sm uppercase tracking-wide">
                    <a href="index.html" class="hover:underline decoration-4 decoration-brand underline-offset-4">Inicio</a>
                    <a href="search.html" class="hover:underline decoration-4 decoration-brand underline-offset-4">Tienda</a>
                </nav>

                <div class="flex items-center gap-3">
                    <a :href="waLink()" target="_blank" class="hidden sm:flex items-center gap-2 bg-black text-white px-4 py-2 border-2 border-transparent font-bold text-sm hover:bg-brand hover:text-black hover:border-black transition-colors">
                        <i class="fab fa-whatsapp text-lg"></i>
                    </a>
                    
                    <button @click="mobileMenu = !mobileMenu" class="lg:hidden text-black p-2 border-2 border-black hover:bg-gray-100">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div x-show="mobileMenu" class="fixed inset-0 z-50 bg-white" style="display: none;">
        <div class="p-4 border-b-2 border-black flex justify-between items-center bg-gray-50">
            <span class="font-black text-xl font-display uppercase">Menú</span>
            <button @click="mobileMenu = false" class="border-2 border-black p-2 hover:bg-red-500 hover:text-white transition">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="p-6 flex flex-col gap-4 text-center">
            <a href="index.html" class="text-2xl font-black font-display uppercase hover:text-brand">Inicio</a>
            <a href="search.html" class="text-2xl font-black font-display uppercase hover:text-brand">Catálogo</a>
            <a href="#footer" class="text-2xl font-black font-display uppercase hover:text-brand">Contacto</a>
            
            <hr class="border-black border-dashed my-4">
            
            <form action="search.html" method="GET" class="relative">
                <input type="text" name="q" placeholder="BUSCAR..." class="w-full border-2 border-black py-3 px-4 font-bold">
            </form>

            <a :href="waLink()" class="btn-bold w-full py-4 font-black uppercase tracking-widest flex items-center justify-center gap-2 mt-4">
                <i class="fab fa-whatsapp text-xl"></i> Chat WhatsApp
            </a>
        </div>
    </div>
</div>


    <section class="relative border-b-4 border-black bg-urban flex flex-col md:flex-row items-stretch min-h-[70vh]">
        
        <div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center border-b-4 md:border-b-0 md:border-r-4 border-black bg-white z-10 relative">
            <div class="inline-block border-2 border-black px-3 py-1 bg-urban font-black text-xs uppercase tracking-widest mb-6 w-max brutal-shadow">
                <span x-text="site?.name"></span> OFICIAL
            </div>
            
            <h1 class="text-5xl md:text-7xl font-black uppercase leading-none tracking-tighter mb-6 text-black">
                <span x-text="site?.content?.heroTitle || 'ROMPE LAS REGLAS.'"></span>
            </h1>
            
            <p class="text-lg md:text-2xl font-bold text-gray-700 mb-10 max-w-lg">
                <span x-text="site?.content?.heroSubtitle || 'Estilo urbano, actitud única. Descubre nuestra nueva colección.'"></span>
            </p>
            
            <div>
                <a href="search.html" class="inline-block bg-urban text-black border-4 border-black px-10 py-4 font-black text-xl uppercase tracking-wider brutal-shadow brutal-button">
                    COMPRAR AHORA <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>
        </div>

        <div class="w-full md:w-1/2 relative bg-urban min-h-[300px]">
            <template x-if="site?.bannerUrl && site?.bannerUrl !== ''"><div class="contents">
                <img :src="site?.bannerUrl" alt="Banner" class="absolute inset-0 w-full h-full object-cover filter contrast-125 saturate-50">
            </div></template><template x-if="!(site?.bannerUrl && site?.bannerUrl !== '')"><div class="contents">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#000 2px, transparent 2px); background-size: 30px 30px;"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-bolt text-black text-[150px] opacity-20"></i>
                </div>
            </div></template>
        </div>
    </section>

    <div class="border-b-4 border-black bg-black text-urban overflow-hidden flex whitespace-nowrap py-3 font-black uppercase tracking-widest text-sm">
        <div class="animate-marquee inline-block">
            <template x-for="i in 10" :key="i"><div class="contents">
                <span>&nbsp;/// ENVÍOS A TODO EL PAÍS /// PAGO SEGURO /// ATENCIÓN 24/7&nbsp;</span>
            </div></template>
        </div>
    </div>
    <style>
        .animate-marquee { animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    </style>

    <section id="destacados" class="py-20 px-4 md:px-8 bg-gray-100">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 border-b-4 border-black pb-4">
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter text-black">
                    DESTACADOS_
                </h2>
                <a href="search.html" class="text-black font-black uppercase text-lg hover:bg-urban px-2 transition-colors mt-4 md:mt-0">
                    VER TODO [+]
                </a>
            </div>

            <template x-if="products.length === 0"><div class="contents">
                <div class="border-4 border-black bg-white p-16 text-center brutal-shadow">
                    <i class="fas fa-skull text-5xl text-gray-300 mb-4 block"></i>
                    <p class="font-black text-2xl text-gray-400 uppercase">NO HAY STOCK TODAVÍA</p>
                </div>
            </div></template><template x-if="!(products.length === 0)"><div class="contents">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                    <template x-for="product in products" :key="product?._id"><div class="contents">
                        <div class="bg-white border-4 border-black brutal-shadow group flex flex-col relative">
                            
                            <div class="absolute top-0 left-0 bg-urban border-r-4 border-b-4 border-black px-3 py-1 font-black text-xs uppercase z-10">
                                <span x-text="product?.category"></span>
                            </div>

                            <template x-if="product?.stock <= 0"><div class="contents">
                                <div class="absolute top-0 right-0 bg-black text-white border-l-4 border-b-4 border-black px-3 py-1 font-black text-xs uppercase z-10">
                                    SOLD OUT
                                </div>
                            </div></template>

                            <a :href="'product.html?id=' + product?._id" class="relative aspect-square block border-b-4 border-black overflow-hidden bg-gray-200">
                                <template x-if="product?.imageUrl"><div class="contents">
                                    <img :src="product?.imageUrl" class="w-full h-full object-cover filter contrast-110 group-hover:scale-110 transition duration-500" :alt="product?.name">
                                </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                                    <div class="w-full h-full flex items-center justify-center text-black opacity-20">
                                        <i class="fas fa-camera text-5xl"></i>
                                    </div>
                                </div></template>
                            </a>
                            
                            <div class="p-5 flex flex-col flex-grow bg-white">
                                <h3 class="text-black font-black text-xl uppercase leading-tight mb-4 flex-grow group-hover:text-urban transition-colors">
                                    <a :href="'product.html?id=' + product?._id"><span x-text="product?.name"></span></a>
                                </h3>
                                
                                <div class="flex items-center justify-between border-t-4 border-black pt-4 mt-auto">
                                    <span class="font-black text-2xl text-black">
                                        <span x-text="formatMoney(product?.price)"></span>
                                    </span>
                                    <a :href="'product.html?id=' + product?._id" class="bg-black text-urban w-10 h-10 flex items-center justify-center hover:bg-urban hover:text-black hover:border-black hover:border-2 transition-all">
                                        <i class="fas fa-plus"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div></template>
                </div>
            </div></template>
        </div>
    </section>

    <footer class="mt-auto border-t-4 border-black bg-white p-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center font-black uppercase text-sm">
            <p>© <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>. TODOS LOS DERECHOS RESERVADOS.</p>
            <div class="flex gap-4 mt-4 md:mt-0">
                <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="hover:text-urban text-2xl"><i class="fab fa-instagram"></i></a></div></template>
                <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="hover:text-urban text-2xl"><i class="fab fa-facebook-square"></i></a></div></template>
                <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="hover:text-urban text-2xl"><i class="fab fa-tiktok"></i></a></div></template>
            </div>
        </div>
    </footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="http://lfaftech.com" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
