<!DOCTYPE html>
<html lang="es" data-wuepy-template="template14">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Libre+Baskerville&family=Inter:wght@400;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/storefront.js"></script>
<style>
  :root{--bg:#020617;--ink:#e2e8f0;--muted:#94a3b8;--card:#0f172a;--accent:#22d3ee;--soft:#082f49;--radius:16px}
  *{box-sizing:border-box} [x-cloak]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter, sans-serif}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  h1,h2,.display{font-family:Inter, sans-serif}
  .wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
  .top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.03em}
  .logo{width:42px;height:42px;border-radius:14px;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
  .nav{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:600}
  .btn{background:var(--accent);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
  .menu{display:none;background:none;border:0;color:inherit;font-size:22px}
  .hero{display:grid;gap:28px;align-items:center;padding:28px 0 10px}
  .hero.split{grid-template-columns:1.1fr .9fr}
  .hero.full{min-height:78vh;border-radius:var(--radius);overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:40px;background:#111 center/cover}
  .hero.full .veil{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.72))}
  .hero.full .copy{position:relative;color:#fff;max-width:680px}
  .hero.center{text-align:center;padding:72px 0 20px}
  .hero.center p,.hero.center .actions{margin-left:auto;margin-right:auto}
  .hero.band{padding:48px 0 10px}
  .kicker{letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--accent);font-weight:800}
  h1{font-size:clamp(42px,7vw,84px);line-height:.92;margin:10px 0 16px;font-weight:560}
  .lead{font-size:18px;line-height:1.6;color:var(--muted);max-width:560px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .frame{border-radius:var(--radius);min-height:420px;background:var(--soft) center/cover;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
  .perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
  .perk{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
  .perk b{display:block;margin-bottom:4px}
  .perk span{color:var(--muted);font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
  .chip{border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);background:transparent;color:inherit;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);display:flex;flex-direction:column;min-height:100%}
  .ph{aspect-ratio:1;background:var(--soft) center/cover}
  .card .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
  .price{font-weight:800}
  .overlay{position:relative;min-height:280px;color:#fff}
  .overlay .ph{position:absolute;inset:0;aspect-ratio:auto}
  .overlay .meta{position:relative;margin-top:auto;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:48px 16px 16px}
  .row{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:12px;background:var(--card);border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
  .row .ph{width:120px;height:96px;aspect-ratio:auto;border-radius:12px}
  .rows{display:flex;flex-direction:column;gap:10px}
  .about{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin:48px 0;padding:28px;background:var(--card);border-radius:var(--radius)}
  .cta{margin:10px 0 48px;padding:36px;border-radius:var(--radius);background:var(--accent);color:#fff;display:flex;justify-content:space-between;gap:16px;align-items:center}
  .cta a{background:#fff;color:#111;border-radius:999px;padding:12px 16px;font-weight:800}
  footer{border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);padding:28px 0 40px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .search{display:flex;gap:8px;margin:18px 0}
  .search input{flex:1;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);background:var(--card);color:inherit;padding:14px 16px;font:inherit}
  .product{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start;padding:24px 0 40px}
  .shot{border-radius:var(--radius);min-height:460px;background:var(--soft) center/cover}
  @media(max-width:860px){
    .nav{display:none}
    .nav.open{display:flex;flex-direction:column;position:absolute;left:16px;right:16px;top:72px;background:var(--card);padding:16px;border-radius:16px;z-index:20}
    .menu{display:block}
    .hero.split,.about,.product,.perks,.grid{grid-template-columns:1fr}
    .hero.full{min-height:70vh;padding:24px}
    .cta{flex-direction:column;align-items:flex-start}
    .row{grid-template-columns:88px 1fr}
    .row .go{grid-column:2}
  }</style>
</head>
<body x-data="shop()" x-cloak>
<header class="wrap" style="position:relative">
    <div class="top">
      <a class="brand" href="index.html">
        <template x-if="site && site.logoUrl"><img class="logo" :src="site.logoUrl" alt=""></template>
        <template x-if="!site || !site.logoUrl"><span class="logo" x-text="letter()"></span></template>
        <span x-text="site?.name || 'Circuito'"></span>
      </a>
      <button class="menu" @click="open=!open" aria-label="Menú">☰</button>
      <nav class="nav" :class="open && 'open'">
        <a href="index.html" @click="open=false">Inicio</a>
        <a href="search.html" @click="open=false">Catálogo</a>
        <a class="btn" :href="wa('Hola, quiero hacer un pedido')" target="_blank">WhatsApp</a>
      </nav>
    </div>
  </header>

<section class="wrap product" x-show="product">
  <div class="shot" :style="(product && img(product)) ? 'background-image:url(' + (product && img(product)) + ')' : ''"></div>
  <div>
    <a href="search.html" style="font-size:13px;font-weight:700">← Catálogo</a>
    <p class="kicker" style="margin-top:18px" x-text="product?.category || 'Electrónica'"></p>
    <h1 style="font-size:clamp(36px,5vw,64px)" x-text="product?.name"></h1>
    <p class="price" style="font-size:28px" x-text="money(product?.price)"></p>
    <p class="lead" x-text="product?.description || 'Consultá stock, colores y tiempo de entrega.'"></p>
    <div class="actions"><a class="btn" :href="wa('Hola, me interesa ' + (product?.name || ''))" target="_blank">Pedir por WhatsApp</a><a class="btn ghost" href="index.html">Volver al inicio</a></div>
  </div>
</section>
<p class="wrap" x-show="site && !product" style="padding:40px 0">No encontramos ese producto.</p>

<footer class="wrap"><span x-text="(site?.name || 'Circuito') + ' · ' + new Date().getFullYear()"></span><span>Electrónica en Wuepy</span></footer>
</body></html>
