<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');
        :root {
            --primary: #d6d3d1; 
            --secondary: #1c1917;
        }
        body { font-family: 'Outfit', sans-serif; color: var(--secondary); background-color: #ffffff; }
        .image-container img { transition: transform 0.8s ease; }
        .image-container:hover img { transform: scale(1.03); }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storefront-pages.js"></script>
    <style>[x-cloak]{display:none !important}</style>
</head>
<body class="flex flex-col min-h-screen" x-data="searchPage()" x-cloak>
    
<header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-24">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="text-2xl tracking-widest uppercase font-bold" style="color: var(--secondary);">
                    <template x-if="site?.logoUrl"><div class="contents">
                        <img class="h-10 w-auto" :src="site?.logoUrl" :alt="site?.name">
                    </div></template><template x-if="!(site?.logoUrl)"><div class="contents">
                        <span x-text="site?.name"></span>
                    </div></template>
                </a>
            </div>
            
            <nav class="hidden md:flex space-x-12">
                <a href="index.html" class="text-sm uppercase tracking-widest text-gray-500 hover:text-black transition-colors">Inicio</a>
                <a href="search.html" class="text-sm uppercase tracking-widest text-gray-500 hover:text-black transition-colors">Catálogo</a>
            </nav>
            
            <div class="flex items-center space-x-6">
                <a href="search.html" class="text-gray-400 hover:text-black transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </a>
                <template x-if="site?.contact && site?.contact?.whatsapp"><div class="contents">
                <a :href="waLink()" target="_blank" class="text-sm uppercase tracking-widest font-bold flex items-center gap-2" style="color: var(--primary);">
                    Contacto
                </a>
                </div></template>
            </div>
        </div>
    </div>
</header>


    <div class="max-w-7xl mx-auto px-4 w-full py-16 border-b border-gray-100 text-center">
        <h1 class="text-4xl font-light tracking-tight mb-4">Catálogo</h1>
        <p class="text-gray-400 font-light text-sm max-w-lg mx-auto">Explora nuestra colección completa de objetos y diseños esenciales.</p>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-16 w-full flex flex-col md:flex-row gap-16">
        
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="sticky top-32">
                <form action="search.html" method="GET" class="mb-10">
                    <input type="text" name="q" :value="searchQuery || ''" placeholder="Buscar..." class="w-full pb-2 border-b border-gray-300 focus:border-black outline-none bg-transparent text-sm font-light placeholder-gray-400 transition-colors">
                    <template x-if="currentCategory"><div class="contents"><input type="hidden" name="category" :value="currentCategory"></div></template>
                </form>

                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-900 mb-6">Categorías</h3>
                <ul class="space-y-4 text-sm font-light">
                    <li>
                        <a :href="'search.html' + (searchQuery ? '?q=' + searchQuery : '').replace('&q=', '?q=')" class="transition-colors" :class="!currentCategory ? 'text-black font-medium' : 'text-gray-500 hover:text-black'">
                            Todas
                        </a>
                    </li>
                    <template x-for="cat in categories" :key="cat"><div class="contents">
                        <li>
                            <a :href="'search.html?category=' + encodeURIComponent(cat) + (searchQuery ? '&q=' + encodeURIComponent(searchQuery) : '')" 
                               class="transition-colors" :class="currentCategory === cat ? 'text-black font-medium' : 'text-gray-500 hover:text-black'">
                                <span x-text="cat"></span>
                            </a>
                        </li>
                    </div></template>
                </ul>
            </div>
        </aside>

        <div class="w-full">
            <template x-if="filteredProducts.length === 0"><div class="contents">
                <div class="py-20 text-center">
                    <h2 class="text-xl font-light text-gray-500 mb-2">No encontramos resultados</h2>
                    <a href="search.html" class="text-xs font-bold uppercase tracking-widest border-b border-black pb-1">Limpiar filtros</a>
                </div>
            </div></template><template x-if="!(filteredProducts.length === 0)"><div class="contents">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
                    <template x-for="product in filteredProducts" :key="product?._id"><div class="contents">
                        <div class="group flex flex-col">
                            <a :href="'product.html?id=' + product?._id" class="image-container relative aspect-[4/5] bg-gray-50 overflow-hidden mb-4 w-full block">
                                <template x-if="product?.imageUrl"><div class="contents">
                                    <img :src="product?.imageUrl" class="w-full h-full object-cover" :alt="product?.name">
                                </div></template><template x-if="!(product?.imageUrl)"><div class="contents">
                                    <div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fas fa-cube text-2xl"></i></div>
                                </div></template>
                            </a>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-sm font-medium mb-1"><a :href="'product.html?id=' + product?._id" class="hover:underline decoration-1 underline-offset-4"><span x-text="product?.name"></span></a></h3>
                                    <p class="text-[10px] text-gray-400 uppercase tracking-widest"><span x-text="product?.category"></span></p>
                                </div>
                                <span class="text-sm font-medium">
                                    <span x-text="formatMoney(product?.price)"></span>
                                </span>
                            </div>
                        </div>
                    </div></template>
                </div>
            </div></template>
        </div>
    </main>

    
<footer class="bg-white border-t border-gray-100 pt-20 pb-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 lg:gap-8 mb-16">
            <div class="lg:col-span-2">
                <h3 class="text-2xl tracking-widest uppercase font-bold mb-6" style="color: var(--secondary);"><span x-text="site?.name"></span></h3>
                <p class="text-gray-500 font-light leading-relaxed max-w-sm">
                    <span x-text="site?.content?.aboutText || 'Simplicidad, diseño y funcionalidad en cada uno de nuestros productos. Seleccionados con cuidado para tu espacio.'"></span>
                </p>
            </div>
            
            <div>
                <h4 class="text-xs font-bold uppercase tracking-[0.2em] mb-6" style="color: var(--secondary);">Nuestra Tienda</h4>
                <ul class="space-y-4 text-gray-500 font-light text-sm">
                    <li class="flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> <span x-text="site?.contact?.address || 'Online'"></span></li>
                    <li class="flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span x-text="site?.contact?.schedule || '24/7'"></span></li>
                </ul>
            </div>
            
            <div>
                <h4 class="text-xs font-bold uppercase tracking-[0.2em] mb-6" style="color: var(--secondary);">Redes</h4>
                <div class="flex space-x-6">
                    <template x-if="site?.social && site?.social?.instagram"><div class="contents"><a :href="site?.social?.instagram" target="_blank" class="text-gray-400 hover:text-black transition-colors"><i class="fab fa-instagram text-xl"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.facebook"><div class="contents"><a :href="site?.social?.facebook" target="_blank" class="text-gray-400 hover:text-black transition-colors"><i class="fab fa-facebook-f text-xl"></i></a></div></template>
                    <template x-if="site?.social && site?.social?.tiktok"><div class="contents"><a :href="site?.social?.tiktok" target="_blank" class="text-gray-400 hover:text-black transition-colors"><i class="fab fa-tiktok text-xl"></i></a></div></template>
                </div>
            </div>
        </div>
        
        <div class="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-gray-100 text-xs text-gray-400 uppercase tracking-widest">
            <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="site?.name"></span>.</p>
            <p class="mt-4 md:mt-0">Diseño Minimalista</p>
        </div>
    </div>
</footer>


    <section class="px-4 py-8">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-5" style="border:2px solid var(--wuepy-primary)">
            <div>
                <p class="font-black text-lg">¿Te gusta esta tienda?</p>
                <p class="text-sm opacity-70">Crea la tuya con catálogo, búsqueda y WhatsApp.</p>
            </div>
            <a href="http://lfaftech.com" class="px-5 py-3 font-black text-white" style="background:var(--wuepy-primary)">Crear mi tienda ahora</a>
        </div>
    </section>
</body>
</html>
