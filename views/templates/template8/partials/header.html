<header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-24">
            <div class="flex-shrink-0 flex items-center">
                <a href="/" class="text-2xl tracking-widest uppercase font-bold" style="color: var(--secondary);">
                    <% if(site.logoUrl) { %>
                        <img class="h-10 w-auto" src="<%= site.logoUrl %>" alt="<%= site.name %>">
                    <% } else { %>
                        <%= site.name %>
                    <% } %>
                </a>
            </div>
            
            <nav class="hidden md:flex space-x-12">
                <a href="/" class="text-sm uppercase tracking-widest text-gray-500 hover:text-black transition-colors">Inicio</a>
                <a href="/search" class="text-sm uppercase tracking-widest text-gray-500 hover:text-black transition-colors">Catálogo</a>
            </nav>
            
            <div class="flex items-center space-x-6">
                <a href="/search" class="text-gray-400 hover:text-black transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </a>
                <% if(site.contact && site.contact.whatsapp) { %>
                <a href="https://wa.me/<%= site.contact.whatsapp %>" target="_blank" class="text-sm uppercase tracking-widest font-bold flex items-center gap-2" style="color: var(--primary);">
                    Contacto
                </a>
                <% } %>
            </div>
        </div>
    </div>
</header>
