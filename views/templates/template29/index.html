<!DOCTYPE html>
<html lang="es" data-wuepy-template="template29">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/storefront.js"></script>
<style>:root{--brand:#4f46e5} body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0} a{color:inherit} .brand{color:var(--brand)} .bg-brand{background:var(--brand);color:#fff}</style>
</head>
<body x-data="shop()" x-cloak>

<header style="padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid currentColor">
  <a href="index.html" style="font-size:28px;font-weight:800;text-decoration:none"><span x-show="site?.logoUrl"><img :src="site.logoUrl" alt="" style="height:42px;vertical-align:middle;margin-right:8px"></span><span x-text="site?.name || 'Mayorista'"></span></a>
  <nav style="display:flex;gap:16px"><a href="search.html">Catálogo</a><a class="bg-brand" style="padding:8px 14px;text-decoration:none" :href="wa('Hola')">WhatsApp</a></nav>
</header>
<main style="padding:28px;max-width:1100px;margin:auto">
  <p style="letter-spacing:.2em;text-transform:uppercase;font-size:12px">Mayorista</p>
  <h1 style="font-size:56px;line-height:.95;margin:8px 0" x-text="site?.content?.heroTitle || site?.name"></h1>
  <p style="font-size:18px;max-width:640px" x-text="site?.content?.aboutText || site?.content?.heroSubtitle || 'Productos listos para encargar por WhatsApp.'"></p>
  <p x-show="site?.contact?.address" x-text="site.contact.address"></p>
  <section style="margin-top:28px"><table style="width:100%;border-collapse:collapse"><template x-for="p in products" :key="p._id"><tr style="border-bottom:1px solid #cbd5e1"><td style="padding:12px" x-text="p.name"></td><td x-text="money(p.price)"></td><td><a :href="'product.html?id='+p._id">Ver</a></td></tr></template></table></section>
</main>
</body></html>
