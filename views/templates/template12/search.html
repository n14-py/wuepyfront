<!DOCTYPE html>
<html lang="es" data-wuepy-template="template12">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/storefront.js"></script>
<style>:root{--brand:#4f46e5} body{font-family:Impact,sans-serif;background:#fff;color:#000;margin:0} a{color:inherit} .brand{color:var(--brand)} .bg-brand{background:var(--brand);color:#fff}</style>
</head>
<body x-data="shop()" x-cloak>

<header style="padding:16px 24px"><a href="index.html" x-text="site?.name || 'Brutal'"></a></header>
<main style="padding:24px;max-width:1100px;margin:auto">
  <form action="search.html"><input name="q" :value="query" placeholder="Buscar" style="padding:12px;width:100%;border:2px solid currentColor;background:transparent;color:inherit"></form>
  <div style="margin-top:20px"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px"><template x-for="p in products" :key="p._id"><a :href="'product.html?id='+p._id" style="display:block;border:3px solid currentColor;padding:8px;text-decoration:none"><div style="height:140px;background:#0001 center/cover" :style="img(p)?'background-image:url('+img(p)+')':''"></div><strong x-text="p.name"></strong><div class="brand" x-text="money(p.price)"></div></a></template></div></div>
</main></body></html>
